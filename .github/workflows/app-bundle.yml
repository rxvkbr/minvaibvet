name: App content bundle (over the air)

# Rebuilds the web part of the Android/iOS app and publishes it as a zip on the
# "app-bundle" release. Installed apps pick it up on their next launch, no store update needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.html", "kalendar.ics", "vendor/**", "img/**","audio/**", "app/scripts/web.js", "desktop/scripts/prep.js"]

permissions:
  contents: write

concurrency:
  group: app-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build www
        working-directory: app
        run: |
          npm ci
          export BUNDLE_STAMP=$(date -u +%y%m%d%H%M)
          echo "BUNDLE_STAMP=$BUNDLE_STAMP" >> "$GITHUB_ENV"
          npm run web
          API=$(node -p "require('./www/bundle.json').nativeApi")
          cd www && zip -qr "$RUNNER_TEMP/bundle.zip" . && cd ..
          SUM=$(sha256sum "$RUNNER_TEMP/bundle.zip" | cut -d' ' -f1)
          mv "$RUNNER_TEMP/bundle.zip" "$RUNNER_TEMP/www-n${API}-${BUNDLE_STAMP}-${SUM}.zip"
          echo "ZIP=$RUNNER_TEMP/www-n${API}-${BUNDLE_STAMP}-${SUM}.zip" >> "$GITHUB_ENV"
      - name: Build the desktop (Вайбвет Офіс) content
        run: |
          node desktop/scripts/prep.js
          pwd; ls -la desktop | head -20
          python3 -c "import os,zipfile;z=zipfile.ZipFile('desktop/desk.zip','w',zipfile.ZIP_DEFLATED);[z.write(os.path.join(r,f),os.path.relpath(os.path.join(r,f),'desktop/www')) for r,_,fs in os.walk('desktop/www') for f in fs];z.close()"
          ls -la desktop/desk.zip
          SUM=$(sha256sum desktop/desk.zip | cut -d' ' -f1)
          mv desktop/desk.zip "$RUNNER_TEMP/desk-d1-${BUNDLE_STAMP}-${SUM}.zip"
          echo "DESK=$RUNNER_TEMP/desk-d1-${BUNDLE_STAMP}-${SUM}.zip" >> "$GITHUB_ENV"
      - name: Publish, keeping the last three bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-bundle >/dev/null 2>&1 || gh release create app-bundle --title "App content bundle" --notes "Web part of the Вайбвет FM app, delivered over the air. Not for manual download." --latest=false
          gh release upload app-bundle "$ZIP" "$DESK" --clobber
          gh release view app-bundle --json assets --jq '.assets[].name' | grep '^www-' | sort -t- -k3,3n | head -n -3 | while read -r a; do gh release delete-asset app-bundle "$a" -y; done
          gh release view app-bundle --json assets --jq '.assets[].name' | grep '^desk-' | sort -t- -k3,3n | head -n -3 | while read -r a; do gh release delete-asset app-bundle "$a" -y; done
