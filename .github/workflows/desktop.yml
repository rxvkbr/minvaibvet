name: Desktop (Вайбвет Офіс)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["office.html", "stil.html", "sova.html", "vendor/**", "desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: VaibvetOffice-windows
          path: desktop/dist/*.exe
      - name: Publish to the "office" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: office-latest
          name: Вайбвет Офіс (Mac і Windows)
          body: "Вайбвет Офіс. Mac: DMG для Apple Silicon (arm64) або Intel (x64), підписаний і нотаризований Apple. Windows: Setup — інсталятор, portable — запускається без встановлення; Windows може попередити про невідомого видавця: «Докладніше» → «Усе одно запустити». Усі завантаження: https://minvaibvet.pp.ua/join#desk"
          make_latest: false
          files: desktop/dist/*.exe
