name: iOS project (widgets target)

# Keeps app/ios/App/App.xcodeproj in step with app/ios/App/VaibvetWidgets: adds the WidgetKit extension target and any
# new .swift file, then commits the project file. Runs on Linux (the xcodeproj gem is plain Ruby), so nobody needs
# Ruby gems on their Mac.
on:
  # Manual only: Actions tab or `gh workflow run ios-project.yml`. Everyday checks run on Andrew's Mac (npx playwright test).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install --no-document xcodeproj
      - run: ruby app/scripts/ios-add-widgets.rb
      - name: Commit the project file
        run: |
          if git diff --quiet -- app/ios/App/App.xcodeproj; then echo "project already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ios/App/App.xcodeproj
          git commit -m "iOS: widgets target in the Xcode project (generated by ios-add-widgets.rb)"
          git pull --rebase -q origin main
          git push
