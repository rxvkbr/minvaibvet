name: iOS

# On every change to the app: compile for the simulator (no signing needed).
# Run by hand (Actions → iOS → Run workflow): sign with the App Store Connect API key and upload to TestFlight.
on:
  # Manual only: Actions tab or `gh workflow run ios.yml`. Everyday checks run on Andrew's Mac (npx playwright test).
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label"
        default: macos-latest

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Copy the site into the app
        run: npm run web && npx cap sync ios

      - name: Home-screen widgets target
        run: ruby scripts/ios-add-widgets.rb   # no-op once ios-project.yml has committed the target

      - name: Compile for the simulator
        if: github.event_name == 'push'
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}

      - name: App Store Connect key
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ] || { [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_BASE64" ]; }; then
            echo "::error::Missing secrets: ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID and ASC_KEY_P8 (the text of the .p8 file)."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # the key may be stored as the file's text (pasted on github.com) or as base64 (from the script)
          if [ -n "$ASC_KEY_P8" ]; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"; fi
          # accept the key however it was pasted: full .p8 text, the body alone, or base64 of the whole file
          RAW=$(cat "$KEY")
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY"; then
            DEC=$(printf '%s' "$RAW" | tr -d ' \r\n\t' | base64 --decode 2>/dev/null || true)
            if printf '%s' "$DEC" | grep -q "BEGIN PRIVATE KEY"; then RAW="$DEC"; fi
          fi
          BODY=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          N=$(printf '%s' "$BODY" | base64 --decode 2>/dev/null | wc -c | tr -d ' ')
          echo "key: ${#RAW} chars pasted, body ${#BODY} base64 chars, $N bytes (a valid App Store Connect key is 138 bytes)"
          [ "$N" -ge 100 ] || { echo "::error::ASC_KEY_P8 is not a valid .p8 key (see sizes above)"; exit 1; }
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          echo "BUILD_NUMBER=$(date -u +%y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: github.event_name == 'workflow_dispatch'
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 60
          exit ${PIPESTATUS[0]}

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch'
        working-directory: app/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          exit ${PIPESTATUS[0]}
