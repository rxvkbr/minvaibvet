name: Промінь (рендер у хмарі)

# «Промінь» renders on GitHub's machines instead of the MacBook Air: a scene pushed into tools/promin/inbox/
# comes out as a PNG on the `promin` branch — https://raw.githubusercontent.com/rxvkbr/minvaibvet/promin/<name>.png
# On the Mac: bash tools/promin/cloud.sh   (downloads the finished pictures into tools/promin/out/)
on:
  # Manual only: scenes render on Andrew's Mac (tools/promin/agents.sh, tools/promin/pro.sh).
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene name in tools/promin/inbox (without .txt); empty = all"
        default: ""

permissions:
  contents: write

concurrency:
  group: promin
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Which scenes
        id: pick
        run: |
          cd tools/promin/inbox
          if [ -n "${{ inputs.scene }}" ]; then list="${{ inputs.scene }}.txt"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD^ HEAD | grep -q 'tools/promin/Promin.java'; then list=$(ls *.txt)
          else list=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- . | xargs -r -n1 basename); fi
          echo "scenes: $list"
          echo "list=$(echo $list)" >> "$GITHUB_OUTPUT"
      - name: Render
        if: steps.pick.outputs.list != ''
        env:
          JAVA_TOOL_OPTIONS: "-Dstdout.encoding=UTF-8 -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
        run: |
          mkdir -p out
          echo "cores: $(nproc)"
          for s in ${{ steps.pick.outputs.list }}; do
            [ -f "tools/promin/inbox/$s" ] || continue
            start=$(date +%s)
            java tools/promin/Promin.java "tools/promin/inbox/$s" "out/${s%.txt}.png" | tail -2
            echo "${s%.txt}: $(( $(date +%s) - start )) s"
          done
      - name: Publish to the promin branch
        if: steps.pick.outputs.list != ''
        run: |
          git config user.name "Промінь"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin promin >/dev/null; then
            git fetch -q origin promin && git worktree add -q pub origin/promin && (cd pub && git checkout -q -B promin)
          else
            git worktree add -q --detach pub && (cd pub && git checkout -q --orphan promin && git rm -rqf .)
          fi
          cp out/*.png pub/
          cd pub
          { echo "# Промінь: готові картинки"; echo; for f in *.png; do echo "- [${f%.png}](https://raw.githubusercontent.com/${{ github.repository }}/promin/$f)"; done; } > README.md
          git add -A && git commit -qm "Промінь: ${{ steps.pick.outputs.list }}" && git push -q origin promin
          for f in ../out/*.png; do b=$(basename "$f"); echo "https://raw.githubusercontent.com/${{ github.repository }}/promin/$b"; done >> "$GITHUB_STEP_SUMMARY"
