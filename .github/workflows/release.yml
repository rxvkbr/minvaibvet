name: Android release (Google Play)

# Run by hand from the Actions tab. Needs four repository secrets, created by
# app/scripts/make-upload-key.sh: UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD,
# UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD.
# Uploading to Play is keyless: GitHub's OIDC token is exchanged for the play-uploader
# service account (set up by app/scripts/play-ci-setup.sh), which may only release to testing tracks.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (alpha = closed testing)"
        default: alpha
      upload:
        description: "Upload to Google Play"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check that the upload key is configured
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Upload key secrets are missing. Run app/scripts/make-upload-key.sh on your Mac first."
            exit 1
          fi
      - run: npm ci
      - run: npm run web
      - run: npx cap sync android
      - name: Build signed release bundle
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$KS_B64" | base64 --decode > "$UPLOAD_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          rm -f "$UPLOAD_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: vaibvet-fm-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Sign in to Google Cloud (no stored key)
        if: ${{ inputs.upload }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/489459531851/locations/global/workloadIdentityPools/github/providers/minvaibvet
          service_account: play-uploader@minvaibvet-ci-20092.iam.gserviceaccount.com
      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        run: |
          npm install --no-save --no-audit --no-fund googleapis
          node scripts/play-upload.js android/app/build/outputs/bundle/release/app-release.aab "${{ inputs.track }}"
