  PRE.forEach(function(p){
    if(p.id==="proxy")return;
    if((provHold.value||"openai")===p.p && $("ep").value.trim()===p.e && $("model").value.trim()===p.m) id=p.id;
  });
  if(!id && $("ep").value.trim()) id="proxy";
  [].forEach.call($("presets").children,function(b){b.setAttribute("aria-pressed",b.dataset.id===id?"true":"false");});
}
function showHits(hits){
  var box=$("hits");box.innerHTML="";
  (hits||[]).forEach(function(h){
    var d=document.createElement("div");d.className="hit";
    var b=document.createElement("b");b.textContent=h.title||h.id;
    var a=document.createElement("a");a.href="https://www.youtube.com/watch?v="+encodeURIComponent(h.id);a.target="_blank";a.rel="noopener";a.textContent="YouTube ↗";
    var p=document.createElement("p");p.textContent=h.text;
    d.appendChild(b);d.appendChild(a);d.appendChild(p);box.appendChild(d);
  });
}
function show(seed, ans){
  var X=T();
  $("paper").hidden=false;
  lastAns=ans;
  $("src").textContent=srcText(ans);
  var said=$("said");said.innerHTML="";
  var mine=document.createElement("span");mine.className="mine";mine.textContent=seed.trim();
  var his=document.createElement("span");his.className="his";his.textContent=(seed.trim()?" ":"")+ (ans.text||"");
  said.appendChild(mine);said.appendChild(his);
  showHits(ans.hits);
  $("paper").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function run(redo){
  var A=window.ANDRIYKO, seed=$("seed").value.trim();
  if(!seed || seed.split(/\s+/).length<2){toast(T().need);feel("warning");$("seed").focus();return;}
  if(busy)return;
  busy=true;paint();feel("click");
  var done=function(ans){
    busy=false;paint();
    show(seed, ans||{text:"",source:"offline",hits:[]});
    feel(ans&&ans.source==="online"?"success":ans&&ans.source==="cache"?"soft":"warning");
  };
  if(!A||!A.complete){done({text:"",source:"offline",hits:[],error:"corpus"});return;}
  A.complete(seed,{redo:!!redo}).then(done,function(e){done({text:"",source:"offline",hits:[],error:e&&e.message});});
}
$("seed").addEventListener("input",paintReg);
$("go").addEventListener("click",function(){run(false);});
$("again").addEventListener("click",function(){feel("tick");run(true);});
$("copy").addEventListener("click",function(){
  var s=$("said").textContent||"";
  var done=function(){toast(T().copied);feel("success");};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done).catch(function(){legacy(s);done();});}
  else{legacy(s);done();}
});
function legacy(s){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();}
$("mic").addEventListener("click",function(){
  var Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){toast(T().noMic);feel("warning");return;}
  if(hearing&&rec){try{rec.stop();}catch(e){}return;}
  rec=new Rec();
  var seed=$("seed").value;
  var latin=/[a-z]/i.test(seed)&&!/[а-яіїєґ]/i.test(seed);
  rec.lang=latin?"en-US":"uk-UA";
  rec.interimResults=true;rec.continuous=true;
  var base=seed.replace(/\s+$/,"");
  var failed=false;
  rec.onresult=function(ev){
    var fin="", mid="", i;
    for(i=0;i<ev.results.length;i++){
      var bit=ev.results[i][0]?ev.results[i][0].transcript:"";
      if(ev.results[i].isFinal) fin+=bit; else mid+=bit;
    }
    var add=(fin+" "+mid).replace(/\s+/g," ").trim();
    $("seed").value=(base?base+" ":"")+add;
    paintReg();
  };
  rec.onerror=function(){failed=true;};
  rec.onend=function(){hearing=false;paint();feel(failed?"warning":"success");};
  try{rec.start();hearing=true;paint();feel("click");}
  catch(e){hearing=false;paint();toast(T().noMic);feel("error");}
});
$("ep").addEventListener("input",markPreset);
$("model").addEventListener("input",markPreset);
$("save").addEventListener("click",function(){
  if(!window.ANDRIYKO)return;
  ANDRIYKO.saveSettings({provider:provHold.value||"openai",endpoint:$("ep").value.trim(),model:$("model").value.trim(),key:$("key").value});
  if($("key").value){$("key").value="";}
  paintNow();toast(T().saved);feel("success");
});
$("wipe").addEventListener("click",function(){
  if(window.ANDRIYKO)ANDRIYKO.clearSettings();
  $("ep").value="";$("model").value="";$("key").value="";provHold.value="openai";
  markPreset();paintNow();toast(T().wiped);feel("warning");
});
(function fill(){
  var s=window.ANDRIYKO&&ANDRIYKO.settings?ANDRIYKO.settings():{provider:"openai",endpoint:"",model:""};
  provHold.value=s.provider||"openai";
  $("ep").value=s.endpoint||"";
  $("model").value=s.model||"";
})();
paint();
})();
</script>
