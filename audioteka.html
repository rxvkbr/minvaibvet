<style>
:root{--bg:#0b0b0d;--card:#1b1b1f;--card2:#26262c;--tx:#f5f5f7;--dim:#9a9aa3;--sc:#ff5500;--gold:#ffc371;--rec:#ff3b30}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.45 -apple-system,Inter,system-ui,sans-serif}
body{padding:calc(10px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top a{text-decoration:none;color:var(--tx);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}
.logo{font:800 19px system-ui}.langs{margin-left:auto;display:flex;gap:4px}.langs button{border:0;background:var(--card);color:var(--dim);border-radius:10px;padding:5px 7px;font:700 11px system-ui;cursor:pointer}.langs button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
h2{font:800 18px system-ui;margin:18px 2px 8px}.lead{color:var(--dim);margin:0 2px 10px}
.trk{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px}.trk b{display:block}.trk small{color:var(--dim)}
.trk button{margin-top:8px;border:0;border-radius:999px;padding:7px 12px;font:700 13px system-ui;background:var(--sc);color:#fff;cursor:pointer}
.trk iframe{width:100%;height:120px;border:0;border-radius:12px;margin-top:8px}
.studio{background:linear-gradient(160deg,#2a1214,#16161a);border:1px solid #ff3b3033;border-radius:22px;padding:14px}
select,textarea,input[type=range]{width:100%}select,textarea{background:#0e0e11;border:1px solid #ffffff1c;color:var(--tx);border-radius:12px;padding:9px 10px;font:600 14px system-ui;margin-bottom:8px}
.prompter{background:#0e0e11;border-radius:14px;padding:14px 16px;max-height:260px;overflow:auto;font:500 19px/1.6 Georgia,"PT Serif",serif;white-space:pre-wrap;margin-bottom:10px}
.lbl{font:700 12px system-ui;color:var(--dim);margin:4px 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row button{flex:1;min-width:130px;border:0;border-radius:14px;padding:13px 8px;font:800 14px system-ui;cursor:pointer;background:var(--card2);color:var(--tx)}
.rec{background:var(--rec)!important;color:#fff!important}.rec.on{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}
audio{width:100%;margin-top:10px}
.gate{background:var(--card);border-radius:16px;padding:14px;color:var(--dim)}.gate a{color:var(--gold)}
.note{color:var(--dim);font-size:12px;margin-top:12px}

</head>
<body>
<div class="top"><a href="index.html#more">←</a><div class="logo" id="ttl"></div><div class="langs" id="langs"></div></div>

  <p class="note" id="note"></p>

 {id:"zapovit",t:{uk:"Тарас Шевченко · «Заповіт» (1845)",en:"Taras Shevchenko · “Testament” (1845)"},x:"Як умру, то поховайте\nМене на могилі,\nСеред степу широкого,\nНа Вкраїні милій,\nЩоб лани широкополі,\nІ Дніпро, і кручі\nБуло видно, було чути,\nЯк реве ревучий.\n\nЯк понесе з України\nУ синєє море\nКров ворожу… отойді я\nІ лани і гори —\nВсе покину і полину\nДо самого Бога\nМолитися… а до того\nЯ не знаю Бога.\n\nПоховайте та вставайте,\nКайдани порвіте\nІ вражою злою кров'ю\nВолю окропіте.\nІ мене в сім'ї великій,\nВ сім'ї вольній, новій,\nНе забудьте пом'янути\nНезлим тихим словом."},
 {id:"sadok",t:{uk:"Тарас Шевченко · «Садок вишневий коло хати» (1847)",en:"Taras Shevchenko · “A cherry orchard by the house” (1847)"},x:"Садок вишневий коло хати,\nХрущі над вишнями гудуть,\nПлугатарі з плугами йдуть,\nСпівають ідучи дівчата,\nА матері вечерять ждуть.\n\nСем'я вечеря коло хати,\nВечірня зіронька встає.\nДочка вечерять подає,\nА мати хоче научати,\nТак соловейко не дає.\n\nПоклала мати коло хати\nМаленьких діточок своїх;\nСама заснула коло їх.\nЗатихло все, тілько дівчата\nТа соловейко не затих."},
 {id:"reve",t:{uk:"Тарас Шевченко · «Реве та стогне Дніпр широкий» (з «Причинної», 1837)",en:"Taras Shevchenko · “The wide Dnipro roars and moans” (1837)"},x:"Реве та стогне Дніпр широкий,\nСердитий вітер завива,\nДодолу верби гне високі,\nГорами хвилю підійма.\n\nІ блідий місяць на ту пору\nІз хмари де-де виглядав,\nНеначе човен в синім морі,\nТо виринав, то потопав.\n\nЩе треті півні не співали,\nНіхто нігде не гомонів,\nСичі в гаю перекликались,\nТа ясен раз у раз скрипів."},

uk:{ttl:"🎙 Аудіотека",lead:"Слухай читання й наспіви Вайбкет FM через SoundCloud. А в студії прочитай класику або заспівай поверх нашої станції.",hLib:"Слухати",hSt:"Студія читання",listen:"▶ Слухати на SoundCloud",

var LN="uk";try{LN=localStorage.getItem("lang")||"uk";}catch(e){}if(!TX[LN])LN=LN==="ru"?"uk":"en";
function T(k){return TX[LN][k];}function L(o){return o[LN]||o.en||o.uk;}

function isPro(){try{return localStorage.getItem("polit-vet")==="1";}catch(e){return false;}}
function nativeMode(m){try{var C=window.Capacitor,P=C&&C.isNativePlatform&&C.isNativePlatform()&&(C.Plugins&&C.Plugins.Purr||C.registerPlugin&&C.registerPlugin("Purr"));if(P&&P.audioMode)return P.audioMode({mode:m}).catch(function(){});}catch(e){}return Promise.resolve();}

/* ===== listening: the official SoundCloud player ===== */
function paintLib(){var B=$("lib");B.innerHTML="";(window.VV_AUDIOTEKA||[]).forEach(function(t){if(!/^https:\/\/soundcloud\.com\/[\w\-\/]+$/.test(t.sc))return;
  var d=document.createElement("div");d.className="trk";d.innerHTML="<b></b><small></small><br><button type='button'></button>";d.querySelector("b").textContent=L(t.title);d.querySelector("small").textContent=t.who||"";
  var b=d.querySelector("button");b.textContent=T("listen");b.onclick=function(){var f=document.createElement("iframe");f.allow="autoplay";f.title=L(t.title);
    f.src="https://w.soundcloud.com/player/?url="+encodeURIComponent(t.sc)+"&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&visual=false";b.replaceWith(f);tap("tick");};B.appendChild(d);});}

/* ===== the studio: voice + one of our stations → a local recording ===== */
var ctx=null,eng=null,mix=null,musicGain=null,mic=null,rec=null,chunks=[],timer=null,takeBlob=null,scrollT=null;
function work(){return WORKS.filter(function(w){return w.id===$("work").value;})[0]||WORKS[0];}
function paintPrompter(){var w=work();$("own").hidden=w.id!=="own";$("prompter").textContent=w.id==="own"?($("own").value||T("own")):w.x;}
function ensureCtx(){if(!ctx){var C=window.AudioContext||window.webkitAudioContext;ctx=new C();mix=ctx.createMediaStreamDestination();musicGain=ctx.createGain();musicGain.connect(ctx.destination);musicGain.connect(mix);}
  if(ctx.state!=="running")ctx.resume();musicGain.gain.value=$("vol").value/100;}
function startMusic(){var k=$("back").value;if(k==="none")return;var M={vals:window.VV_VALS,sumishi:window.VV_SUMISHI,perehavorka:window.VV_PEREHAVORKA}[k];if(!M)return;
  eng=M.make(ctx,musicGain);timer=setInterval(function(){eng&&eng.schedule(ctx.currentTime);},100);}
function stopMusic(){clearInterval(timer);if(eng){eng.stop();eng=null;}}
function startRec(){ensureCtx();
  nativeMode("record").then(function(){return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}).then(function(s){
    mic=s;var src=ctx.createMediaStreamSource(s),g=ctx.createGain();g.gain.value=1.1;src.connect(g);g.connect(mix);startMusic();
    var type=["audio/mp4","audio/webm;codecs=opus","audio/webm"].filter(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t);})[0]||"";
    rec=new MediaRecorder(mix.stream,type?{mimeType:type}:undefined);chunks=[];rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=function(){takeBlob=new Blob(chunks,{type:rec.mimeType||"audio/mp4"});var A=$("take");A.src=URL.createObjectURL(takeBlob);A.hidden=false;$("after").hidden=false;tap("success");};
    rec.start(500);$("rec").textContent=T("stop");$("rec").classList.add("on");tap("tick");
  }).catch(function(){alert(T("noMic"));nativeMode("play");});}
function stopRec(){if(rec&&rec.state!=="inactive")rec.stop();if(mic){mic.getTracks().forEach(function(t){t.stop();});mic=null;}stopMusic();nativeMode("play");
  $("rec").textContent=T("rec");$("rec").classList.remove("on");clearInterval(scrollT);}
$("rec").onclick=function(){rec&&rec.state==="recording"?stopRec():startRec();};
$("vol").oninput=function(){if(musicGain)musicGain.gain.value=this.value/100;};
$("scroll").onclick=function(){var P=$("prompter");clearInterval(scrollT);P.scrollTop=0;scrollT=setInterval(function(){P.scrollTop+=1;if(P.scrollTop+P.clientHeight>=P.scrollHeight)clearInterval(scrollT);},60);};
$("work").onchange=paintPrompter;$("own").oninput=paintPrompter;
$("share").onclick=function(){if(!takeBlob)return;var ext=/webm/.test(takeBlob.type)?"webm":"m4a",name="vaibket-"+work().id+"-"+new Date().toISOString().slice(0,10)+"."+ext,f;
  try{f=new File([takeBlob],name,{type:takeBlob.type});}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:name}).catch(function(){});
  else{var a=document.createElement("a");a.href=URL.createObjectURL(takeBlob);a.download=name;document.body.appendChild(a);a.click();a.remove();}};
$("sc").onclick=function(){window.open("https://soundcloud.com/upload","_blank","noopener");};
window.addEventListener("pagehide",function(){if(rec&&rec.state==="recording")stopRec();});

  var W=$("work"),cur=W.value;W.innerHTML="";WORKS.forEach(function(w){var o=document.createElement("option");o.value=w.id;o.textContent=L(w.t);W.appendChild(o);});W.value=cur||"reve";
  var B=$("back"),cb=B.value;B.innerHTML="";["none","vals","sumishi","perehavorka"].forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=T("back")[k];B.appendChild(o);});B.value=cb||"vals";
  $("own").placeholder=T("own");$("lBack").textContent=T("lBack");$("lVol").textContent=T("lVol");$("rec").textContent=rec&&rec.state==="recording"?T("stop"):T("rec");$("scroll").textContent=T("scroll");
  $("share").textContent=T("share");$("sc").textContent=T("sc");$("note").textContent=T("note");paintPrompter();paintLib();
  var Lg=$("langs");Lg.innerHTML="";["uk","en","nl","de"].forEach(function(l){var b=document.createElement("button");b.textContent=l.toUpperCase();b.setAttribute("aria-pressed",String(l===LN));b.onclick=function(){LN=l;try{localStorage.setItem("lang",l);}catch(e){}paint();};Lg.appendChild(b);});}
