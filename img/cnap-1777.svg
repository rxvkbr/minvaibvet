<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="PT Mono, ui-monospace, Menlo, monospace">
<title>Карикатура Мінвайбкету: ЦНАП 1777 року, клерк у пудреній перуці штампує довідку «стать: жінка, указом двору», заявник у вбранні напівмундир-напівсукня питає «а мене спитати?»</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe3c6"/><stop offset="1" stop-color="#dccaa2"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c6a48"/><stop offset="1" stop-color="#6b4e33"/></linearGradient>
  <pattern id="parquet" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 30L30 0M30 30L60 0" stroke="#5c412a" stroke-width="2" opacity=".45"/></pattern>
  <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#fff6d8" stop-opacity=".6"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  <!-- powdered wig -->
  <g id="wig"><ellipse cx="0" cy="-6" rx="30" ry="26" fill="#f4f1ea"/><circle cx="-26" cy="8" r="11" fill="#f4f1ea"/><circle cx="26" cy="8" r="11" fill="#f4f1ea"/><circle cx="-26" cy="24" r="9" fill="#ebe6da"/><circle cx="26" cy="24" r="9" fill="#ebe6da"/><path d="M-18 -26q18-14 36 0" stroke="#d9d2c2" stroke-width="3" fill="none"/></g>
  <!-- a waiting citizen of 1777 -->
  <g id="cit"><path d="M-22 0q0-58 22-62q22 4 22 62z" fill="#5b6f8f"/><circle cx="0" cy="-74" r="15" fill="#f0cfa8"/><use href="#wig" transform="translate(0 -78) scale(.6)"/><rect x="-14" y="-36" width="18" height="12" rx="2" fill="#fffaf0" stroke="#999"/></g>
</defs>
<rect width="1200" height="680" fill="url(#wall)"/>
<!-- boiserie panels -->
<g fill="none" stroke="#c9b48a" stroke-width="4"><rect x="30" y="140" width="190" height="300" rx="8"/><rect x="980" y="140" width="190" height="300" rx="8"/></g>
<!-- chandelier glow -->
<ellipse cx="600" cy="0" rx="520" ry="300" fill="url(#glow)"/>
<g transform="translate(600 40)"><path d="M0 -40v40" stroke="#b4914a" stroke-width="3"/><path d="M-70 10q70 40 140 0" stroke="#d9a441" stroke-width="5" fill="none"/><g fill="#ffd27a"><circle cx="-70" cy="6" r="6"/><circle cx="-35" cy="22" r="6"/><circle cx="0" cy="26" r="6"/><circle cx="35" cy="22" r="6"/><circle cx="70" cy="6" r="6"/></g></g>
<!-- sign -->
<rect x="330" y="88" width="540" height="62" rx="8" fill="#1b2a4a" stroke="#d9a441" stroke-width="4"/>
<text x="600" y="128" font-size="28" fill="#f2e3bd" text-anchor="middle" letter-spacing="3">ЦНАП · ВЕРСАЛЬ · 1777</text>
<text x="600" y="172" font-size="14" fill="#7a5a2e" text-anchor="middle">центр надання адміністративних послуг Його Величності · прийом до 11:45</text>
<!-- floor -->
<rect y="500" width="1200" height="180" fill="url(#floor)"/><rect y="500" width="1200" height="180" fill="url(#parquet)"/>
<!-- the queue, left -->
<use href="#cit" x="80" y="560"/><use href="#cit" x="150" y="566"/><use href="#cit" x="220" y="560"/>
<g font-size="12" fill="#3a2a14" text-anchor="middle"><text x="80" y="590">№ 1776</text><text x="150" y="596">№ 1777</text><text x="220" y="590">№ 1778</text></g>
<text x="150" y="620" font-size="12" fill="#3a2a14" text-anchor="middle">«я тут з Регентства»</text>

<!-- window №4 -->
<rect x="610" y="200" width="460" height="300" rx="10" fill="#6b4a2a"/>
<rect x="630" y="220" width="420" height="200" rx="6" fill="#cfe3ea" opacity=".55"/>
<rect x="630" y="220" width="420" height="200" rx="6" fill="none" stroke="#3d2a16" stroke-width="5"/>
<rect x="760" y="186" width="160" height="36" rx="6" fill="#d9a441"/><text x="840" y="211" font-size="20" fill="#1a100b" text-anchor="middle" font-weight="700">ВІКНО № 4</text>
<!-- clerk behind glass -->
<g transform="translate(840 330)">
  <path d="M-70 90q0-90 70-96q70 6 70 96z" fill="#7a1f2e"/>
  <path d="M-12 -4l12 30l12-30z" fill="#fffaf0"/><path d="M-20 0q20 16 40 0" stroke="#fffaf0" stroke-width="8" fill="none"/>
  <circle cx="0" cy="-34" r="26" fill="#f0cfa8"/>
  <use href="#wig" transform="translate(0 -40)"/>
  <circle cx="-9" cy="-36" r="3" fill="#2a1a10"/><circle cx="9" cy="-36" r="3" fill="#2a1a10"/>
  <path d="M-8 -22q8 -4 16 0" stroke="#2a1a10" stroke-width="2.5" fill="none"/>
  <circle cx="-14" cy="-28" r="4" fill="#ff9a9a" opacity=".6"/><circle cx="14" cy="-28" r="4" fill="#ff9a9a" opacity=".6"/>
</g>
<!-- counter -->
<rect x="590" y="420" width="500" height="80" fill="#4e331c"/><rect x="590" y="412" width="500" height="14" fill="#8a5a34"/>
<!-- the certificate, stamped -->
<g transform="translate(700 380) rotate(-6)">
  <rect width="190" height="120" fill="#fffaf0" stroke="#b49a66" stroke-width="2"/>
  <text x="95" y="24" font-size="13" fill="#3a2a14" text-anchor="middle">ДОВІДКА</text>
  <text x="95" y="44" font-size="10" fill="#3a2a14" text-anchor="middle">про стать заявника</text>
  <path d="M20 58h150M20 72h120" stroke="#cbb994" stroke-width="2"/>
  <g transform="translate(95 92) rotate(-8)"><rect x="-80" y="-18" width="160" height="34" rx="4" fill="none" stroke="#c8202f" stroke-width="3"/><text x="0" y="4" font-size="15" fill="#c8202f" text-anchor="middle" font-weight="700">ЖІНКА · УКАЗОМ ДВОРУ</text></g>
</g>
<!-- stamp in the clerk's hand -->
<g transform="translate(910 372) rotate(18)"><rect x="-10" y="-46" width="20" height="40" rx="6" fill="#3a2418"/><rect x="-22" y="-8" width="44" height="14" rx="3" fill="#c8202f"/></g>
<!-- quill & ink -->
<g transform="translate(1020 404)"><rect x="-12" y="-14" width="24" height="18" rx="4" fill="#1b1b1b"/><path d="M0 -12q30-60 60-70q-24 30-58 72z" fill="#fffaf0" stroke="#b49a66"/></g>

<!-- the applicant: half dragoon captain, half gown -->
<g transform="translate(420 600)">
  <!-- gown half (right) -->
  <path d="M0 -210q60 6 70 60l60 150h-130z" fill="#ff8fc4"/>
  <path d="M10 -150q40 6 52 20M14 -110q48 8 70 30M18 -70q60 8 92 40" stroke="#ffd0e6" stroke-width="4" fill="none"/>
  <!-- uniform half (left) -->
  <path d="M0 -210q-46 4 -54 50l-6 160h60z" fill="#1d3f8a"/>
  <path d="M-48 -170h44M-50 -130h46M-52 -90h48" stroke="#d9a441" stroke-width="4"/>
  <rect x="-58" y="-214" width="22" height="10" rx="3" fill="#d9a441"/>
  <path d="M-56 0v40M-20 0v40" stroke="#1d3f8a" stroke-width="16"/><path d="M-64 40h20M-28 40h20" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <!-- sword on the uniform side -->
  <path d="M-64 -120l-50 120" stroke="#c9ccd3" stroke-width="5"/><path d="M-72 -128l18 14" stroke="#d9a441" stroke-width="6"/>
  <!-- arm with a fan on the gown side: 💅 -->
  <path d="M58 -170q40 10 50 -30" stroke="#ff8fc4" stroke-width="18" stroke-linecap="round" fill="none"/>
  <g transform="translate(112 -210)"><path d="M0 0l-30 -40a50 50 0 0 1 60 0z" fill="#fff1f8" stroke="#ff6fb5" stroke-width="2"/><path d="M0 0l-18 -44M0 0l0 -48M0 0l18 -44" stroke="#ff6fb5" stroke-width="1.5"/></g>
  <!-- head with wig -->
  <circle cx="0" cy="-236" r="26" fill="#f0cfa8"/>
  <use href="#wig" transform="translate(0 -242)"/>
  <path d="M-10 -240l-4 -2M10 -240l4 -2" stroke="#2a1a10" stroke-width="3" stroke-linecap="round"/>
  <path d="M-8 -224q8 5 16 0" stroke="#c8202f" stroke-width="3" fill="none"/>
  <circle cx="16" cy="-230" r="3" fill="#2a1a10"/><!-- beauty mark -->
</g>
<text x="575" y="628" font-size="14" fill="#fff3d6" text-anchor="start">← заявник(ця): шевальє д'Еон</text>

<!-- speech bubbles -->
<g font-size="16" fill="#1d1d1b">
  <path d="M890 34h296v84h-200l-60 120 20-120h-56z" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="1038" y="62" text-anchor="middle">Стать визначено указом.</text>
  <text x="1038" y="84" text-anchor="middle">Сукню носити обов'язково.</text>
  <text x="1038" y="106" text-anchor="middle" font-weight="700">Наступний!</text>
  <path d="M60 236h270v56h-40l60 52-100-52h-190z" fill="#fff4fa" stroke="#333" stroke-width="2"/>
  <text x="195" y="270" text-anchor="middle">А мене спитати? 💅</text>
</g>
<!-- caption -->
<rect y="644" width="1200" height="36" fill="#1a100bee"/>
<text x="600" y="668" font-size="15" fill="#f2e3bd" text-anchor="middle">МІНВАЙБКЕТ · ГЕНДЕРНЕ ПРОСВІТНИЦТВО · ЦНАП XVIII століття, тільки з перуками</text>
</svg>
