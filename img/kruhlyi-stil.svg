<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="PT Mono, ui-monospace, Menlo, monospace">
<title>Карикатура Мінвайбкету: за круглим столом трьох держав підсідає рандомний українець зі своїм розкладним стільцем</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e1cf"/><stop offset="1" stop-color="#d8cdb6"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa0b4"/><stop offset="1" stop-color="#6f8196"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a2a"/><stop offset="1" stop-color="#4e2c17"/></linearGradient>
  <radialGradient id="lamp" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
  <!-- delegate: a faceless grey silhouette in a suit, with an interpretation earpiece -->
  <g id="del">
    <path d="M-34 0q0-46 34-52q34 6 34 52z" fill="#2b2f38"/>
    <path d="M-6 -52l6 22l6-22z" fill="#c9ccd3"/><path d="M-2 -46l2 14l2-14z" fill="#7d2630"/>
    <ellipse cx="0" cy="-70" rx="17" ry="20" fill="#9aa0ab"/>
    <path d="M14 -76q8 6 2 16" stroke="#222" stroke-width="3" fill="none"/><circle cx="16" cy="-62" r="3.5" fill="#222"/>
  </g>
  <g id="chair"><rect x="-30" y="-92" width="60" height="96" rx="10" fill="#e8dfc9" stroke="#6b4a2a" stroke-width="5"/><rect x="-20" y="-80" width="40" height="70" rx="6" fill="#f4efe2"/></g>
  <g id="mic"><rect x="-14" y="-6" width="28" height="8" rx="2" fill="#333"/><path d="M0 -6q-4-24 10-34" stroke="#333" stroke-width="2.5" fill="none"/><circle cx="10" cy="-41" r="3" fill="#e0603f"/></g>
</defs>

<!-- room -->
<rect width="1200" height="640" fill="url(#wall)"/>
<rect y="372" width="1200" height="268" fill="url(#floor)"/>
<path d="M0 372h1200" stroke="#b9ab8c" stroke-width="3"/>
<g stroke="#a9b8c9" stroke-width="2" fill="none" opacity=".5"><path d="M40 470q120-30 240 0t240 0t240 0t240 0t240 0"/><path d="M0 560q140-34 280 0t280 0t280 0t280 0t280 0"/></g>
<!-- landscape painting -->
<rect x="40" y="40" width="330" height="200" fill="#eef0e6" stroke="#b49a66" stroke-width="8"/>
<g fill="#6f8a6a" opacity=".75"><path d="M48 230l60-90 40 50 50-80 60 70 40-40 64 90z"/><path d="M60 230l40-50 30 30 40-60 50 60 30-20 40 40z" fill="#3f5c46"/></g>
<!-- the three flags: plain stripes and stars, no emblems -->
<g transform="translate(430 40)">
  <rect x="0" y="0" width="6" height="290" fill="#b49a66"/>
  <rect x="6" y="10" width="70" height="20" fill="#fff"/><rect x="6" y="30" width="70" height="20" fill="#2a5db0"/><rect x="6" y="50" width="70" height="20" fill="#d03030"/>
  <rect x="96" y="0" width="6" height="290" fill="#b49a66"/>
  <rect x="102" y="10" width="76" height="60" fill="#d82c20"/><path d="M118 22l3 9h9l-7 5 3 9-8-6-8 6 3-9-7-5h9z" fill="#ffdd00"/>
  <rect x="198" y="0" width="6" height="290" fill="#b49a66"/>
  <g transform="translate(204 10)"><rect width="76" height="60" fill="#fff"/><g fill="#c8202f"><rect y="0" width="76" height="5"/><rect y="10" width="76" height="5"/><rect y="20" width="76" height="5"/><rect y="30" width="76" height="5"/><rect y="40" width="76" height="5"/><rect y="50" width="76" height="5"/></g><rect width="32" height="30" fill="#2a3e86"/></g>
</g>
<!-- the fourth flag, brought along -->
<g transform="translate(1036 150)">
  <rect x="0" y="0" width="5" height="210" fill="#5a5a50" transform="rotate(8)"/>
  <g transform="rotate(8)"><path d="M5 6h62q-6 14 0 28H5z" fill="#2b62c4"/><path d="M5 34h62q-6 14 0 28H5z" fill="#f2d24a"/></g>
</g>
<ellipse cx="600" cy="40" rx="420" ry="230" fill="url(#lamp)"/>
<!-- interpreters' booth in the back -->
<rect x="820" y="220" width="170" height="70" rx="4" fill="#5e3a22"/><g fill="#22252c"><circle cx="855" cy="208" r="10"/><circle cx="905" cy="208" r="10"/><circle cx="955" cy="208" r="10"/></g>
<text x="905" y="262" font-size="11" fill="#f2e3bd" text-anchor="middle">СИНХРОННИЙ ПЕРЕКЛАД</text>

<!-- chairs behind the table -->
<use href="#chair" x="250" y="360"/><use href="#chair" x="600" y="330"/><use href="#chair" x="950" y="360"/>
<!-- delegates (faceless, seen as one more grey suit each) -->
<use href="#del" x="250" y="380"/><use href="#del" x="600" y="352"/><use href="#del" x="950" y="380"/>

<!-- the round table -->
<ellipse cx="600" cy="452" rx="450" ry="96" fill="#3d2213"/>
<ellipse cx="600" cy="436" rx="450" ry="92" fill="url(#wood)"/>
<ellipse cx="600" cy="436" rx="300" ry="50" fill="#5a331c" stroke="#8a5a34" stroke-width="3"/>
<g fill="#e48ab8"><circle cx="560" cy="420" r="16"/><circle cx="585" cy="410" r="18"/><circle cx="615" cy="410" r="18"/><circle cx="640" cy="420" r="16"/><circle cx="600" cy="424" r="18"/></g>
<g fill="#f4b3d3"><circle cx="572" cy="414" r="7"/><circle cx="605" cy="404" r="8"/><circle cx="630" cy="414" r="7"/></g>
<path d="M150 452q0 90 60 120h780q60-30 60-120" fill="#4e2c17"/>
<g fill="#3d2213"><rect x="240" y="520" width="40" height="110"/><rect x="580" y="540" width="40" height="96"/><rect x="920" y="520" width="40" height="110"/></g>
<!-- name cards and mics -->
<g font-size="15" font-weight="700" text-anchor="middle" fill="#1d1d1b">
  <rect x="216" y="404" width="70" height="26" fill="#fff" stroke="#999"/><text x="251" y="422">РФ</text>
  <rect x="565" y="380" width="70" height="26" fill="#fff" stroke="#999"/><text x="600" y="398">КНР</text>
  <rect x="915" y="404" width="70" height="26" fill="#fff" stroke="#999"/><text x="950" y="422">США</text>
</g>
<use href="#mic" x="310" y="430"/><use href="#mic" x="660" y="406"/><use href="#mic" x="1010" y="430"/>
<!-- papers -->
<g fill="#fbfaf4" stroke="#bbb"><rect x="300" y="430" width="64" height="40" transform="rotate(-6 332 450)"/><rect x="820" y="440" width="64" height="40" transform="rotate(5 852 460)"/></g>
<text x="332" y="456" font-size="9" fill="#555" text-anchor="middle" transform="rotate(-6 332 450)">ПРО УКРАЇНУ</text>
<text x="852" y="466" font-size="9" fill="#555" text-anchor="middle" transform="rotate(5 852 460)">ПРО УКРАЇНУ</text>

<!-- ===== the random Ukrainian, front and centre, on his own camping stool ===== -->
<g transform="translate(430 612) scale(1.08)">
  <!-- folding stool -->
  <path d="M-44 0l60 -54M44 0l-60 -54" stroke="#3a4a2a" stroke-width="7" stroke-linecap="round"/>
  <path d="M-40 -60h80" stroke="#55603a" stroke-width="14" stroke-linecap="round"/>
  <!-- body from behind-ish, leaning on the table -->
  <path d="M-46 -60q4-80 46-86q42 6 46 86z" fill="#5d6b3c"/>
  <path d="M-30 -120q30 -14 60 0" stroke="#4b5730" stroke-width="5" fill="none"/>
  <rect x="-10" y="-112" width="20" height="10" rx="2" fill="#2b62c4"/><rect x="-10" y="-102" width="20" height="10" rx="2" fill="#f2d24a"/>
  <!-- head with beanie -->
  <circle cx="0" cy="-168" r="24" fill="#e9c9a3"/>
  <path d="M-25 -172a25 25 0 0 1 50 0h4v8h-58z" fill="#2b62c4"/><rect x="-27" y="-168" width="54" height="7" fill="#f2d24a"/>
  <!-- arms reaching to the table -->
  <path d="M-40 -110q-30 -10 -44 -40" stroke="#5d6b3c" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M40 -110q30 -10 44 -40" stroke="#5d6b3c" stroke-width="16" stroke-linecap="round" fill="none"/>
</g>
<!-- his things on the table: laptop, thermos, 3-in-1 coffee, cardboard name card -->
<g transform="translate(500 470)">
  <path d="M0 0h70l-6 -40h-58z" fill="#2a2f1c" stroke="#9fd66a" stroke-width="2"/>
  <text x="35" y="-17" font-size="8" fill="#9fd66a" text-anchor="middle">Вайбкет Стіл</text>
  <rect x="-6" y="0" width="82" height="5" rx="2" fill="#1b1f14"/>
</g>
<g transform="translate(680 430)"><rect width="16" height="40" rx="5" fill="#3a5a4a"/><rect x="-2" y="-6" width="20" height="8" rx="3" fill="#222"/></g>
<g transform="translate(708 456)"><path d="M0 0l22 0l-3 14h-16z" fill="#f2e3bd"/><path d="M4 -4q4 -8 8 0" stroke="#bbb" fill="none"/><text x="11" y="10" font-size="6" fill="#7a4a2a" text-anchor="middle">3в1</text></g>
<g transform="translate(588 482) rotate(-4)"><rect width="116" height="30" fill="#c9a36e" stroke="#8a6a3e"/><text x="58" y="21" font-size="17" font-weight="700" fill="#1d1d1b" text-anchor="middle" font-family="Comic Sans MS, Marker Felt, cursive">УКРАЇНА</text></g>

<!-- speech bubbles -->
<g font-size="15" fill="#1d1d1b">
  <path d="M430 166h300v62h-130l-14 22-6-22h-150z" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="580" y="192" text-anchor="middle">…а тепер питання України.</text>
  <text x="580" y="214" text-anchor="middle" fill="#555" font-size="13">(синхронний переклад: «без неї»)</text>
  <path d="M30 500h300v58h-300z M330 518l42 6l-42 14z" fill="#fffbe6" stroke="#333" stroke-width="2"/>
  <text x="180" y="524" text-anchor="middle">О, то я вчасно. Стілець свій,</text>
  <text x="180" y="544" text-anchor="middle">чай свій, питання теж моє.</text>
</g>
<!-- caption -->
<rect x="0" y="606" width="1200" height="34" fill="#0d0f0aee"/>
<text x="600" y="629" font-size="15" fill="#f2e3bd" text-anchor="middle" letter-spacing=".5">МІНВАЙБКЕТ · КРУГЛИЙ СТІЛ · нічого про Україну без України. Рандомний українець приносить табуретку сам</text>
</svg>
