<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="PT Mono, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1a11"/><stop offset="1" stop-color="#4a2f1f"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ad5"/><stop offset="1" stop-color="#c86bff"/></linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#sky)"/>
  <!-- lamp -->
  <rect x="392" y="60" width="8" height="300" fill="#1a100b"/>
  <path d="M370 60h52l-10 22h-32z" fill="#1a100b"/>
  <ellipse cx="396" cy="92" rx="70" ry="22" fill="#f0a93a" opacity=".18"/>
  <circle cx="396" cy="84" r="7" fill="#ffe08a"/>
  <!-- sign -->
  <rect x="260" y="18" width="280" height="34" rx="8" fill="#1a100b" stroke="#f0a93a"/>
  <text x="400" y="41" text-anchor="middle" font-size="15" fill="#f0a93a">ВАЙБКЕТ ТАКСІ · стоянка</text>
  <!-- road -->
  <rect y="360" width="800" height="100" fill="#1a100b"/>
  <g fill="#f2e3bd" opacity=".5"><rect x="30" y="405" width="60" height="6"/><rect x="150" y="405" width="60" height="6"/><rect x="270" y="405" width="60" height="6"/><rect x="390" y="405" width="60" height="6"/><rect x="510" y="405" width="60" height="6"/><rect x="630" y="405" width="60" height="6"/><rect x="750" y="405" width="60" height="6"/></g>

  <!-- TWINK car: small, rounded -->
  <g transform="translate(40 230)">
    <path d="M20 120 Q20 80 60 74 L100 30 Q118 14 150 14 L210 14 Q240 14 258 40 L285 74 Q320 80 320 120 Z" fill="url(#pink)"/>
    <path d="M108 36 Q122 24 148 24 L176 24 L176 72 L78 72 Z" fill="#bfe8ff" opacity=".85"/>
    <path d="M186 24 L208 24 Q232 24 246 44 L266 72 L186 72 Z" fill="#bfe8ff" opacity=".85"/>
    <rect x="128" y="0" width="70" height="18" rx="5" fill="#fff" stroke="#c86bff"/>
    <text x="163" y="13" text-anchor="middle" font-size="11" fill="#c86bff">ТВІНК</text>
    <g><circle cx="88" cy="122" r="28" fill="#1a100b"/><circle cx="88" cy="122" r="14" fill="#ff5dc8"/><circle cx="252" cy="122" r="28" fill="#1a100b"/><circle cx="252" cy="122" r="14" fill="#ff5dc8"/></g>
    <circle cx="300" cy="96" r="6" fill="#fff8b0"/>
    <!-- sparkles -->
    <g fill="#fff"><path d="M30 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M300 20l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></g>
    <!-- music notes -->
    <g fill="#ff9ad5" font-size="20"><text x="212" y="-6">♪</text><text x="236" y="-22">♫</text></g>
    <!-- matcha cup on dash -->
    <rect x="152" y="54" width="14" height="16" rx="3" fill="#7ccf8a"/>
    <text x="170" y="150" text-anchor="middle" font-size="13" fill="#f2e3bd" transform="translate(0 50)">Present Continuous</text>
  </g>

  <!-- DADDY car: boxy vintage Volvo-ish -->
  <g transform="translate(430 214)">
    <path d="M10 136 L10 92 Q10 82 22 80 L70 74 L100 26 Q106 18 118 18 L250 18 Q262 18 268 28 L296 74 L338 80 Q350 82 350 94 L350 136 Z" fill="#3c4a5a"/>
    <rect x="10" y="108" width="340" height="8" fill="#c9ced6"/>
    <path d="M110 30 L176 30 L176 74 L84 74 Z" fill="#9fb3c4" opacity=".8"/>
    <path d="M186 30 L256 30 L282 74 L186 74 Z" fill="#9fb3c4" opacity=".8"/>
    <!-- plaid blanket on back seat -->
    <g transform="translate(196 50)"><rect width="56" height="24" fill="#a63a2a"/><g stroke="#f0a93a" stroke-width="2"><line x1="14" y1="0" x2="14" y2="24"/><line x1="34" y1="0" x2="34" y2="24"/><line x1="0" y1="9" x2="56" y2="9"/><line x1="0" y1="18" x2="56" y2="18"/></g></g>
    <!-- water bottle -->
    <rect x="150" y="50" width="9" height="22" rx="3" fill="#bfe8ff"/>
    <rect x="148" y="0" width="74" height="18" rx="3" fill="#f2e3bd" stroke="#1a100b"/>
    <text x="185" y="13" text-anchor="middle" font-size="11" fill="#1a100b">ДЕДДІ</text>
    <g><circle cx="80" cy="138" r="28" fill="#1a100b"/><circle cx="80" cy="138" r="13" fill="#c9ced6"/><circle cx="282" cy="138" r="28" fill="#1a100b"/><circle cx="282" cy="138" r="13" fill="#c9ced6"/></g>
    <rect x="334" y="92" width="14" height="12" rx="2" fill="#ffe08a"/>
    <!-- speech bubble -->
    <g transform="translate(250 -64)"><rect width="104" height="40" rx="12" fill="#f2e3bd"/><path d="M24 40 l-6 16 18-16z" fill="#f2e3bd"/><text x="52" y="25" text-anchor="middle" font-size="14" fill="#1a100b">Ти поїв?</text></g>
    <text x="180" y="216" text-anchor="middle" font-size="13" fill="#f2e3bd">Past Perfect</text>
  </g>

  <!-- tariff board -->
  <g transform="translate(30 70)">
    <rect width="186" height="96" rx="8" fill="#1a100b" stroke="#4a2f1f"/>
    <text x="12" y="22" font-size="11" fill="#b9a47f">ОПЛАТА</text>
    <text x="12" y="44" font-size="12" fill="#ff9ad5">твінк: «а давай ти?»</text>
    <text x="12" y="64" font-size="12" fill="#f2e3bd">дедді: включено</text>
    <text x="12" y="84" font-size="11" fill="#b9a47f">conditional: якби</text>
  </g>
</svg>
