   "kind": "verse",
   "chapters": [
    {
     "id": "p1",
     "title": "Пісня перша. Пекло",
     "html": "<p>Земне життя пройшовши до третьої черги,\nя опинивсь у темряві глухій,\nне через гріх: Укренерго вимкнуло нерви.<\/p><p>Аж бачу, йде назустріч дід старий,\nпан Котляревський, із люлькою й при вусі:\n«Еней був парубок моторний. Ти який?»<\/p><p>«Ходім, — сказав, — я тут Вергілій по сумісництву.\nХто ж іще травестив Вергілія, як не я?\nТримайся ближче, тут кола за прописками».<\/p><p>Перше коло — ЦНАП, де вічна сім'я\nдуш, що прийшли «лиш спитати» ще при Кучмі.\nДруге — Дія: «технічні роботи» з початку буття.<\/p><p>Третє — ВЛК, де придатним визнали навіть Цербера.\nЧетверте — чат ОСББ, найлютіше з усіх.\nА дев'яте не крижане, а телеграмне:\nтам кожен грішник «має інсайд», і там найтемніше.<\/p>"

    {
     "id": "p2",
     "title": "Пісня друга. Чистилище",
     "html": "<p>Гора Чистилища звалася Ягодин.\nТам душі чистились чотирнадцять годин\nу черзі, з «Резерв+» напоготові, без вин.<\/p><p>На терасі першій знімали гріх «а що люди скажуть».\nНа другій вчились казати «ні» без вибачень.\nНа третій варили борщ при генераторі й не плакали.<\/p><p>А на вершині Котляревський зупинився:\n«Далі мені не можна, сину. В Рай\nпускають тільки з перекладом. Я свій лиш заповідав».<\/p>"
    },
    {
     "id": "p3",
     "title": "Пісня третя. Рай (з машиною)",
     "html": "<p>Аж тут, як у старих греків, з-під небес\nспустилась машина. Тільки не кран, а велосипед:\nбез рук, з парасолькою, проти вітру, двометровий бог.<\/p><p>Він приземлився на велодоріжку з нічого,\nпоклав мені на долоню строопвафель,\nпоставив біля обрію F-16 і сказав коротко:<\/p><p class=\"solo\">«Doe normaal».<\/p><p>Я спитав: «А де ж Рай? Нагорі, за хмарами?»\nВін засміявся, як сміються ті, хто не вміє брехати:\n«Нагорі? Ні. Наш Рай на сім метрів нижче рівня моря».<\/p><p>«Щоночі ми його відкачуємо. Разом. Без пафосу.\nБог створив світ, а Нідерланди створили ми.\nРай не дають згори. Його тримають дамбою».<\/p><p>І я подивився на дамбу та впізнав себе:\nми теж щоночі відкачуємо темряву,\nтільки з іронією замість вітряків.<\/p><p>Тут мій зір зустрівся з голландським світлом Рембрандта,\nі рухало мене вже не кохання, що рухає сонце й інші зорі,\nа світло, що вмикається за графіком. І зорі.<\/p><p class=\"hush\">Тссс. Отець Андрій ще спить.<\/p>"

  {
   "id": "lytsar",
   "kick": "Книга друга",
   "title": "Лицар",
   "about": "Драма в діях, що пишуться наживо: лицар вирішує, шо і за чим. У другій дії — тричі змінені плани, дві богині й бал для одного глядача.",
   "kind": "drama",
   "ongoing": true,
   "tbc": "Наступна дія виходить, коли лицар вирішить, шо і за чим. Машина чекає надворі.",
   "chapters": [
    {
     "id": "d1",
     "title": "Дія перша. «Не земля, а черговість»",
     "html": "<p class=\"dir\">Лицар вирушає не видивлятися нову землю, а вирішувати, шо і за чим робити.<\/p><ul class=\"cast\"><li><b>ЛИЦАР СУМНОГО КАПЮШОНА<\/b><\/li><li><b>СТЕЛЯ<\/b>, нідерландська, біла, з одним швом посередині, як меридіан<\/li><li><b>ПОЛИЦЯ<\/b>, на якій акуратно складене минуле<\/li><li><b>ГАЧКИ<\/b>, наполовину порожні<\/li><li><b>ХОР<\/b> українського народу, за кадром, у телефоні<\/li><li><b>ПОЛІЦІЯ ВАЙБІВ<\/b>, ШІ-асистована<\/li><\/ul><p class=\"dir\">Кімната. 22:39. Камера дивиться в стелю, бо стеля тут єдине, що не треба вирішувати. У віконці відеодзвінка ЛИЦАР дивиться вгору. Так дивиться святий на бароковому полотні, коли йому сказали, що чудо буде, але спершу треба заповнити форму.<\/p><div class=\"role\">Лицар<\/div><p class=\"line\">Колумб шукав землю. Еней шукав землю.\nЯ свою вже знайшов: вона пласка\nй лежить нижче рівня моря.\nМені лишилось дрібне. Вирішити, шо і за чим.\nСпершу дах чи робота? Робота чи мова?\nМова чи серце?<\/p><p class=\"dir\">(пауза)<\/p><p class=\"line\">Серце, як відомо, без BSN не реєструють.<\/p><div class=\"role\">Хор <i>(з телефона, ритмічно)<\/i><\/div><p class=\"line\">Шо і за чим! Шо і за чим!\nМама питає, чи ти поїв!<\/p><div class=\"role\">Стеля <i>(рівно, без емоцій)<\/i><\/div><p class=\"line\">Eerst koffie.<\/p><div class=\"role\">Полиця<\/div><p class=\"line\">Я вже склала одяг. Бачиш?\nВирішувати можна по одній речі.<\/p><p class=\"dir\">Входить ПОЛІЦІЯ ВАЙБІВ і козиряє екраном.<\/p><div class=\"role\">Поліція вайбів<\/div><p class=\"line\">Рапорт. Вайб м'який,\nале досить гострий, щоб помітити.\nПрихована нота ангостури.<\/p><div class=\"role\">Лицар<\/div><p class=\"line\">Ангостура гірка. Але без кількох крапель\nкоктейль не тримає форми.<\/p><div class=\"role\">Хор<\/div><p class=\"line\">То шо ж перше?!<\/p><div class=\"role\">Лицар <i>(так і не відводить очей від стелі)<\/i><\/div><p class=\"line\">Перше вирішено: я не вирішуватиму все сьогодні.<\/p><p class=\"dir\">Ліворуч синя штора м'яко падає замість завіси. Надворі під ліхтарем стоїть припаркований велосипед. На ньому, без рук і з парасолькою, сидить Deus ex machina і терпляче чекає другої дії.<\/p><p class=\"curtain\">ЗАВІСА<\/p>"
    },
    {
     "id": "d2",
     "title": "Дія друга. «Тричі за годину, або Бал у Абкауде»",
     "new": true,
     "html": "<p class=\"hush\">Жіноче в чоловікові — це дозвіл на вразливість без утрати себе. Покора, яку вибираєш сам, уже не покора, а жест.<\/p><p class=\"pr\"><a class=\"pill\" href=\"https://youtu.be/6dIB8vev-9E\" target=\"_blank\" rel=\"noopener\">▶ Слухати в авторському читанні ↗<\/a><\/p><p class=\"pr\">Ой у славнім Абкауде, де вітряки крутяться, а сусіди здороваються з качками, сидів козак Андрійко над кавою. Опівдні з'явилися йому дві богині.<\/p><p class=\"pr\">Перша — <b>Афродіта<\/b>: платиновий блиск, байкерська куртка, голос з хрипотою, наче вона щойно розбила серце й дискотеку разом. Друга — <b>Діана<\/b>: ступала, як мисливиця по подіуму, і кожен її крок падав на підлогу, мов вирок.<\/p><p class=\"pr\">— Що, козаче, — мовила Афродіта, — куди серце тягне?\n— До війська, — каже козак. — До голландського.\n— Ох, — засміялась Діана й перевірила тятиву. — Туди тільки з голландським паспортом. Закон, козаче. Цілюсь я влучно, та паспорта не дам.<\/p><blockquote class=\"chorus\"><i>Приспів:<\/i>\nВітряки крутяться — а плани ще швидше,\nодна година — і світ уже інший,\nхто сьогодні солдат — завтра в оборонці,\nа післязавтра ночує в Кракові при сонці.<\/blockquote><h3 class=\"sub\">Зміна перша<\/h3><p class=\"pr\">Почухав козак чуба:\n— Тоді в оборонку! Європа велика!<\/p><p class=\"pr\">Пішов він по світу, як по каталогу. У Данії — радари й гелікоптерні інженери. У Дуйвендрехті, за десять хвилин від хати, — DeltaQuad: шукають інструктора з дронів.\n— Оце моє! — вигукнув козак. — Я ж на FlyEye літав!\n— А права водійські маєш? — спитала Діана.\n— Нема.\n— А ліцензію A1/A3?\n— Буде.\n— А п'ять років на крилатих машинах, як хоче Destinus?\n— Місяць. Зате бойовий.<\/p><p class=\"pr\">Афродіта погладила його по голові:\n— Нічого, серденько. Чесний лист кращий за брехливе резюме.<\/p><p class=\"pr\">А тоді з'явилася вакансія від Auterion, гарна, як різдвяна листівка. Тільки в Цюриху, і тільки для громадян ЄС.\n— Ну, Швейцаріє, — зітхнув козак, — тебе я теж відпускаю.<\/p><h3 class=\"sub\">Зміна друга<\/h3><p class=\"pr\">Аж тут Діана глянула на календар:\n— Козаче, а в суботу ти де ночуєш?<\/p><p class=\"pr\">Бо домовився козак з Давидом з Абкауде на два тижні, а козацьке слово — не голландська погода, не змінюється за годину.<\/p><p class=\"pr\">Знайшов він готель модний, з коворкінгом і реєстрацією за адресою, просто мрія. Глянув на ціну: <b>двісті шістдесят євро за ніч<\/b>.\n— Я, — каже козак тихо, — в овердрафті, богине.<\/p><blockquote class=\"chorus\"><i>Приспів (тихіше, під акустику):<\/i>\nДвісті шістдесят — то не ціна, а вирок,\nа в банку мінус, як у полі вирва,\nта в кишені — квиток до Кракова на суботу,\nбо козак, навіть сам того не знаючи, планував наперед.<\/blockquote><p class=\"pr\">— Стоп, — сказала Афродіта. — У тебе вже є квиток до Кракова?\n— Є.\n— То чого ж ми в Амстердамі житло шукаємо?<\/p><h3 class=\"sub\">Інтермецо: бал у Абкауде<\/h3><p class=\"pr\">Діана зняла лук і поставила його до вітряка, як мікрофон на стійку. Афродіта ввімкнула біт, низький і рівний, наче серце, яке знає, куди йде.<\/p><p class=\"pr\">— <b>Catwalk!<\/b> — крикнула Діана.<\/p><p class=\"pr\">І козак пішов. Не маршем, як учили на плацу, а від стегна: плечі розслаблені, підборіддя вгору, наче шлях до голландського війська стелиться прямо під ноги.<\/p><p class=\"pr\">— <b>Hands!<\/b><\/p><p class=\"pr\">Долоні пішли малювати в повітрі: Данію, радари, гелікоптери. Пальці склалися в рамку й показали DeltaQuad, за десять хвилин від хати. І тут же рука, не зупиняючись, перетекла у відмову: <i>п'ять років досвіду? ні.<\/i> Козак не обірвав жест, а дозволив йому вилитися в наступний.<\/p><p class=\"pr\">— <b>Duckwalk!<\/b><\/p><p class=\"pr\">Присів низько, на самих носках, і пішов до Цюриха. Дорогою зрозумів: <i>лише для громадян ЄС<\/i>. І крутнувся на місці так, що Швейцарія лишилась позаду, як шлейф.<\/p><p class=\"pr\">— <b>Spin! — і — DIP!<\/b><\/p><p class=\"pr\">Двісті шістдесят євро за ніч. Він закрутився, підняв ногу і впав на спину. Не від поразки, а як падають у вогінгу, коли падіння є найвищою точкою номера. Підлога прийняла його, як прийняла б будь-кого в овердрафті, хто не втратив стилю.<\/p><p class=\"pr\">Зала завмерла.<\/p><p class=\"pr\">— Ну? — спитала Діана. — Встанеш?<\/p><p class=\"pr\">А козак лежав і усміхався. Він згадав: квиток до Кракова вже в кишені.<\/p><p class=\"pr\">— <b>Floor performance<\/b>, — прошепотіла Афродіта.<\/p><p class=\"pr\">І він підвівся. Не ривком, а хвилею: від підлоги до колін, від колін до стегон, від стегон до піднятої руки. Цим одним рухом він опинився на нарах Dizzy Daisy за п'ятдесят п'ять євро.<\/p><blockquote class=\"chorus\">Бо вогінг — не «чоловіче» чи «жіноче»,\nа перетікання з одного в інше,\nколи тобі кажуть позу, а ти\nвже стоїш в іншій,\nі це — не зрада першої,\nа її продовження.<\/blockquote><p class=\"pr\">Діана повільно, по-подіумному, кивнула й назвала оцінку:<\/p><p class=\"pr\">— <b>Tens. Tens. Tens across the board.<\/b><\/p><h3 class=\"sub\">Зміна третя<\/h3><p class=\"pr\">Написав козак побратимові по дотепах, що живе в Празі:\n— Можна в тебе на дивані два тижні?\n— Два тижні — то багато, — відповів побратим. — І в мене на роботі свій бал, без музики.\n— Ну шо ж, ти впораєшся, — відписав козак. — Підкажу, як шо.\n— Подумаю і напишу ввечері.<\/p><p class=\"pr\">Не тиснув козак, бо знав: дружбу, як і хостел, краще бронювати з безкоштовним скасуванням.<\/p><p class=\"pr\">І знайшов він у Кракові <b>Dizzy Daisy<\/b> — п'ять ночей за <b>п'ятдесят п'ять євро<\/b>, ліжко на другому поверсі нар, заїзд з третьої до четвертої. Хостел підтвердив, і доплачувати не треба.<\/p><p class=\"pr\">А наостанок, як справжній козак, що з бою виходить з трофеєм, сів він писати лист до <b>WB Group<\/b>, тих самих, що роблять FlyEye:\n— Я ваш дрон у полі тримав, тепер хочу бути корисним.<\/p><p class=\"pr\">Діана опустила лук:\n— Оце постріл.<\/p><blockquote class=\"chorus\"><i>Фінальний приспів (усі разом, з вітряками на бек-вокалі):<\/i>\nОпівдні — в армію, о першій — до хостелу,\nміж ними — Данія, Цюрих і крила над полем,\nтри плани за годину — не хаос, а танець,\nбо козак не губиться — козак обирає.<\/blockquote><h3 class=\"sub\">Мораль<\/h3><p class=\"pr\">Пішли богині, лишивши по собі блиск і запах кави. Козак допив свою. Плани на життя мінялися тричі, але щоразу лишалися три речі: квиток, чесність і бажання бути корисним.<\/p><p class=\"pr\">А в суботу о третій він заїде в хостел у Кракові.<\/p><h3 class=\"sub\">Бал для одного глядача<\/h3><p class=\"pr\">Увечері в Абкауде богині вже пішли, а біт лишився: тихий, з кухонної колонки, поруч із чайником.<\/p><p class=\"pr\">Давид сидів на дивані з чашкою, як суддя, що прийшов на бал випадково і лишився назавжди.<\/p><p class=\"pr\">— Покажи, — сказав він. — Те, що ти сьогодні робив.<\/p><p class=\"pr\">Козак став посеред кімнати, між рюкзаком і вітряком на підвіконні, і почав.<\/p><div class=\"bal-stage\" tabindex=\"0\"><\/div><p class=\"pr\"><b>Catwalk<\/b> — від дверей до столу: крок від стегна, підборіддя вгору, як колись на плацу, тільки тепер про красу, а не про стрій.<\/p><p class=\"pr\"><b>Hands<\/b> — долоні намалювали в повітрі Данію, Цюрих і дрон над полем, а тоді склалися в рамку, і в рамці опинився Давид.<\/p><p class=\"pr\"><b>Duckwalk<\/b> — низенько, на носках, до самого дивана. Давид підібрав ноги й засміявся вперше за вечір.<\/p><p class=\"pr\"><b>Spin — і dip.<\/b> Козак упав на килим, на спину, з піднятою рукою. Це не поразка — найвища точка номера.<\/p><p class=\"pr\">Тиша. Чайник клацнув.<\/p><p class=\"pr\">— Ну? — спитав козак з підлоги.<\/p><p class=\"pr\">Давид поставив чашку, нахилився й дуже серйозно, по-голландськи, показав десять пальців.<\/p><p class=\"pr\">— Tien. Tien. Tien.<\/p><p class=\"pr\">А козак лежав і думав: у суботу Краків, хостел за п'ятдесят п'ять, лист до WB Group. Плани мінялися тричі, але цей глядач, хоч би де, — не змінювався.<\/p><p class=\"pr\">Він підвівся хвилею, від килима до піднятої руки, і закінчив номер саме там, де Давид міг її взяти.<\/p><details class=\"perf\"><summary>Тричі за годину — коротка версія для виконання вголос (~1 хв)<\/summary><p class=\"dir\">Діана кличе, козак відповідає, зала відбиває такт. Чим коротші команди Діани і чим ширші паузи перед «DIP» і «Floor», тим сильніше спрацьовує.<\/p><p class=\"line\"><b>ДІАНА:<\/b> Catwalk!\n<b>КОЗАК:<\/b>\nОпівдні — до війська, крок від стегна,\nта паспорт не той — і закрита стіна.\nНе падаю — <b>йду.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b> Hands!\n<b>КОЗАК:<\/b>\nМалюю в повітрі Данію й дрони,\nDeltaQuad, радари, чужі кордони.\nВідмова? — то жест. Я веду його <b>далі.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b> Duckwalk!\n<b>КОЗАК:<\/b>\nНизенько, на носках — аж до Цюриха,\n«лише громадянам» — і я крутнувся тихо.\nШвейцарія — шлейф. <b>За спиною.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b> Spin!\n<b>КОЗАК:<\/b>\nДвісті шістдесят за одну ніч —\n<b>ДІАНА:<\/b> DIP!\n<b>КОЗАК:<\/b> <i>(падає)<\/i>\n…і я лежу. І це — не кінець.\nЦе — <b>вершина номера.<\/b><\/p><p class=\"line\"><i>(пауза. біт тихне)<\/i><\/p><p class=\"line\"><b>АФРОДІТА:<\/b> <i>(пошепки)<\/i> Floor.\n<b>КОЗАК:<\/b> <i>(підводиться хвилею)<\/i>\nВід підлоги — до коліна,\nвід коліна — до стегна,\nвід стегна — до руки над головою:\nу кишені — <b>Краків.<\/b>\nП'ятдесят п'ять євро.\nНари. Субота. Третя дня.<\/p><p class=\"line\"><b>ЗАЛА:<\/b> <i>(в один голос)<\/i>\nКажуть позу —\n<b>ти вже в іншій.<\/b>\nЦе не зрада —\n<b>це продовження.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b>\nTens.\nTens.\n<b>Tens across the board.<\/b><\/p><p class=\"line\"><i>(світло гасне на піднятій руці)<\/i><\/p><\/details><p class=\"pr\"><a class=\"pill\" href=\"https://youtu.be/6dIB8vev-9E\" target=\"_blank\" rel=\"noopener\">▶ Слухати в авторському читанні ↗<\/a><\/p>"
    }
   ]

<script>
(function(){
  "use strict";
  var B=JSON.parse(document.getElementById("book").textContent);
  var app=document.getElementById("app"),now=document.getElementById("now"),prog=document.getElementById("prog");
  var KEY="vv-komediia";
  var st=(function(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}return o||{};})();
  st.read=st.read||{};st.pos=st.pos||{};st.last=st.last||{};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function br(id){for(var i=0;i<B.branches.length;i++)if(B.branches[i].id===id)return B.branches[i];return null;}
  function key(b,c){return b.id+"/"+c.id;}
  function doneIn(b){return b.chapters.filter(function(c){return st.read[key(b,c)];}).length;}
  function nextIn(b){var l=st.last[b.id];if(l){for(var i=0;i<b.chapters.length;i++)if(b.chapters[i].id===l&&!st.read[key(b,b.chapters[i])])return b.chapters[i];}
    for(var j=0;j<b.chapters.length;j++)if(!st.read[key(b,b.chapters[j])])return b.chapters[j];return l?(b.chapters.filter(function(c){return c.id===l;})[0]||b.chapters[0]):b.chapters[0];}

  /* font size, kept on this device */
  var fs=+(st.fs||19);function applyFs(){document.documentElement.style.setProperty("--fs",fs+"px");}applyFs();
  document.getElementById("fsm").onclick=function(){fs=Math.max(15,fs-1);st.fs=fs;save();applyFs();};
  document.getElementById("fsp").onclick=function(){fs=Math.min(26,fs+1);st.fs=fs;save();applyFs();};

  function home(){
    now.textContent="Безкінечна читалка";document.title=B.title+" · Вайбвет FM";
    var h='<section class="cover"><div class="kick">Вайбвет FM · Відділ великої літератури</div><h1>'+esc(B.title)+'</h1><p class="sub">'+esc(B.sub)+'</p>'+
      '<div class="au">'+esc(B.author)+'<br><span style="color:var(--dim)">'+esc(B.series)+'</span></div><div class="bike" aria-hidden="true">🚲☂️</div>'+
      '<div class="off">📴 читається без інтернету · прогрес лише на цьому пристрої</div></section>';
    var lb=st.lastBranch&&br(st.lastBranch);
    if(lb){var c=nextIn(lb);h+='<div class="cont"><a class="cta" href="#'+lb.id+'/'+c.id+'">Продовжити: '+esc(lb.title)+' · '+esc(c.title.split(".")[0])+' →</a></div>';}
    h+='<h2 class="sect">Сюжетні гілки · читай будь-яку окремо</h2><div class="branches">';
    B.branches.forEach(function(b){
      var d=doneIn(b),n=b.chapters.length,fresh=b.chapters.some(function(c){return c.new&&!st.read[key(b,c)];});
      h+='<a class="br" href="#'+b.id+'"><small>'+esc(b.kick)+(b.ongoing?' · пишеться наживо':'')+'</small>'+(fresh?' <span class="new">● нове</span>':'')+
        '<b>'+esc(b.title)+'</b><p>'+esc(b.about)+'</p><div class="meta"><span>'+n+' '+(b.kind==="drama"?(n===1?"дія":"дії"):(n<5?"пісні":"пісень"))+'</span><span>'+(d===n?"прочитано ✓":d?"прочитано "+d+" з "+n:"ще не почато")+'</span></div>'+
        '<div class="bar"><i style="width:'+(n?d/n*100:0)+'%"></i></div></a>';
    });
    h+='</div><h2 class="sect">Додатки</h2><div class="extra"><a class="pill" href="#osoby">🎭 Дійові особи</a><a class="pill" href="#kasting">🎬 Кастинг</a>'+
      (Object.keys(st.read).length?'<button class="pill" id="reset">↺ почати все спочатку</button>':'')+'</div>'+
      '<div class="end">'+esc(B.hush)+'<br>Данте, Котляревський і голландські дамби справжні, решта на совісті Мінвайбвету.</div>';
    app.innerHTML=h;
    var r=document.getElementById("reset");if(r)r.onclick=function(){if(confirmIn(r)){st.read={};st.pos={};st.last={};st.lastBranch=null;save();home();}};
  }
  function confirmIn(btn){if(btn.dataset.sure){return true;}btn.dataset.sure=1;btn.textContent="↺ точно? натисни ще раз";setTimeout(function(){if(btn.isConnected){delete btn.dataset.sure;btn.textContent="↺ почати все спочатку";}},3000);return false;}

  function branch(b){
    now.textContent=b.kick+" · "+b.title;document.title=b.title+" · "+B.title;
    var h='<div class="chap"><div class="kick">'+esc(b.kick)+'</div><h1>'+esc(b.title)+'</h1><p class="dir" style="font-style:normal">'+esc(b.about)+'</p><ul class="toc">';
    b.chapters.forEach(function(c){var r=st.read[key(b,c)],p=st.pos[key(b,c)];
      h+='<li class="'+(r?"done":"")+'"><a href="#'+b.id+'/'+c.id+'"><span>'+esc(c.title)+(c.new&&!r?' <span class="new">● нове</span>':'')+'</span><span class="st">'+(r?"✓":p>.05?Math.round(p*100)+"%":"")+'</span></a></li>';});
    h+='</ul>'+(b.tbc?'<div class="tbc"><b>Далі буде</b>'+esc(b.tbc)+'<div style="font-size:26px;margin-top:8px">🚲☂️</div></div>':'')+'<div class="nav"><a href="#"><small>←</small>Усі гілки</a>'+
      '<a class="nx" href="#'+b.id+'/'+nextIn(b).id+'"><small>'+(doneIn(b)?"продовжити":"почати")+' →</small>'+esc(nextIn(b).title)+'</a></div></div>';
    app.innerHTML=h;
  }

  var cur=null,restoreY=0,openedAt=0,dwellT=0;
  function chapter(b,c){
    var i=b.chapters.indexOf(c),pv=b.chapters[i-1],nx=b.chapters[i+1];
    now.textContent=b.title+" · "+c.title;document.title=c.title+" · "+B.title;
    st.last[b.id]=c.id;st.lastBranch=b.id;save();
    var h='<article class="chap '+(b.kind==="verse"?"verse":"drama")+'"><div class="kick">'+esc(b.kick)+' · '+esc(b.title)+'</div><h1>'+esc(c.title)+'</h1>'+c.html+'</article>';
    if(!nx&&b.tbc)h+='<div class="tbc"><b>Далі буде</b>'+esc(b.tbc)+'<div style="font-size:26px;margin-top:8px">🚲☂️</div></div>';
    h+='<div class="nav">'+(pv?'<a href="#'+b.id+'/'+pv.id+'"><small>← назад</small>'+esc(pv.title)+'</a>':'<a href="#'+b.id+'"><small>← зміст</small>'+esc(b.title)+'</a>')+
      (nx?'<a class="nx" href="#'+b.id+'/'+nx.id+'"><small>далі →</small>'+esc(nx.title)+'</a>':'<a class="nx" href="#"><small>кінець гілки →</small>Інші гілки</a>')+'</div>';
    app.innerHTML=h;cur={b:b,c:c};try{[].forEach.call(app.querySelectorAll(".bal-stage"),function(x){window.VV_BAL&&VV_BAL(x);});}catch(e){}openedAt=Date.now();clearTimeout(dwellT);dwellT=setTimeout(tick,3100);
    restoreY=st.pos[key(b,c)]||0;
    requestAnimationFrame(function(){var hh=document.documentElement.scrollHeight-innerHeight;window.scrollTo(0,restoreY>0.02&&restoreY<.97?restoreY*hh:0);tick();});
  }
  function others(id){
    if(id==="osoby"){now.textContent="Дійові особи";app.innerHTML='<div class="chap"><div class="kick">Додаток</div><h1>Дійові особи</h1><dl class="people">'+
      B.people.map(function(p){return '<dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd>';}).join("")+'</dl><div class="nav"><a href="#"><small>←</small>Усі гілки</a><a class="nx" href="#kasting"><small>→</small>Кастинг</a></div></div>';}
    else{now.textContent="Кастинг";app.innerHTML='<div class="chap"><div class="kick">Додаток</div><h1>Кастинг</h1><p class="note">неофіційний · у мріях Мінвайбвету · агентів ще не повідомлено</p><dl class="people">'+
      B.casting.map(function(p){return '<dt>'+esc(p[0])+'</dt><dd><b style="color:var(--ivory)">'+esc(p[1])+'.</b> '+esc(p[2])+'</dd>';}).join("")+'</dl><div class="nav"><a href="#osoby"><small>←</small>Дійові особи</a><a class="nx" href="#"><small>→</small>Усі гілки</a></div></div>';}
  }

  function route(){
    cur=null;var h=decodeURIComponent(location.hash.replace(/^#/,"")).split("/");
    var b=br(h[0]);
    if(h[0]==="osoby"||h[0]==="kasting")others(h[0]);
    else if(b&&h[1]){var c=b.chapters.filter(function(x){return x.id===h[1];})[0];if(c){chapter(b,c);return;}branch(b);}
    else if(b)branch(b);else home();
    window.scrollTo(0,0);tick();
  }
  var tt=0;
  function tick(){
    var hh=document.documentElement.scrollHeight-innerHeight,y=hh>0?Math.max(0,Math.min(1,scrollY/hh)):1;
    prog.style.width=(cur?y*100:0)+"%";
    if(!cur)return;
    var k=key(cur.b,cur.c);
    if((y>=.97||hh<=8)&&Date.now()-openedAt>3000){if(!st.read[k]){st.read[k]=1;}}
    st.pos[k]=y;clearTimeout(tt);tt=setTimeout(save,300);
  }
  addEventListener("scroll",tick,{passive:true});addEventListener("resize",tick);
  addEventListener("hashchange",route);
  addEventListener("pagehide",save);
  document.getElementById("back").addEventListener("click",function(e){
    if(location.hash&&location.hash!=="#"){e.preventDefault();var h=location.hash.slice(1).split("/");location.hash=h.length>1?h[0]:"";return;}
    try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){e.preventDefault();history.back();}}catch(_){}
  });
  document.addEventListener("keydown",function(e){
    if(!cur||e.metaKey||e.ctrlKey||e.altKey||/input|textarea/i.test((e.target.tagName||"")))return;
    var i=cur.b.chapters.indexOf(cur.c);
    if(e.key==="ArrowRight"&&cur.b.chapters[i+1])location.hash=cur.b.id+"/"+cur.b.chapters[i+1].id;
    if(e.key==="ArrowLeft"&&cur.b.chapters[i-1])location.hash=cur.b.id+"/"+cur.b.chapters[i-1].id;
  });
  route();
})();
</script>
</body>
</html>
