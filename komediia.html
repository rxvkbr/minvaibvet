<script type="application/json" id="book">{"title": "Божествєнна комедія українського народу", "sub": "з deus ex machina нідерландського народу", "author": "Ксав'є Фьодорович Бриченко", "series": "книга «Андрій Аманд»", "hush": "читати пошепки, поки отець Андрій спить", "branches": [{"id": "komediia", "kick": "Книга перша", "title": "Комедія", "about": "Пекло з колами ЦНАПу й чату ОСББ, Чистилище на горі Ягодин, Рай на сім метрів нижче рівня моря, куди бог спускається на велосипеді.", "kind": "verse", "chapters": [{"id": "p1", "title": "Пісня перша. Пекло", "html": "<p>Земне життя пройшовши до третьої черги,\nя опинивсь у темряві глухій,\nне через гріх: Укренерго вимкнуло нерви.<\/p><p>Аж бачу, йде назустріч дід старий,\nпан Котляревський, із люлькою й при вусі:\n«Еней був парубок моторний. Ти який?»<\/p><p>«Ходім, — сказав, — я тут Вергілій по сумісництву.\nХто ж іще травестив Вергілія, як не я?\nТримайся ближче, тут кола за прописками».<\/p><p>Перше коло — ЦНАП, де вічна сім'я\nдуш, що прийшли «лиш спитати» ще при Кучмі.\nДруге — Дія: «технічні роботи» з початку буття.<\/p><p>Третє — ВЛК, де придатним визнали навіть Цербера.\nЧетверте — чат ОСББ, найлютіше з усіх.\nА дев'яте не крижане, а телеграмне:\nтам кожен грішник «має інсайд», і там найтемніше.<\/p>"}, {"id": "p2", "title": "Пісня друга. Чистилище", "html": "<p>Гора Чистилища звалася Ягодин.\nТам душі чистились чотирнадцять годин\nу черзі, з «Резерв+» напоготові, без вин.<\/p><p>На терасі першій знімали гріх «а що люди скажуть».\nНа другій вчились казати «ні» без вибачень.\nНа третій варили борщ при генераторі й не плакали.<\/p><p>А на вершині Котляревський зупинився:\n«Далі мені не можна, сину. В Рай\nпускають тільки з перекладом. Я свій лиш заповідав».<\/p>"}, {"id": "p3", "title": "Пісня третя. Рай (з машиною)", "html": "<p>Аж тут, як у старих греків, з-під небес\nспустилась машина. Тільки не кран, а велосипед:\nбез рук, з парасолькою, проти вітру, двометровий бог.<\/p><p>Він приземлився на велодоріжку з нічого,\nпоклав мені на долоню строопвафель,\nпоставив біля обрію F-16 і сказав коротко:<\/p><p class=\"solo\">«Doe normaal».<\/p><p>Я спитав: «А де ж Рай? Нагорі, за хмарами?»\nВін засміявся, як сміються ті, хто не вміє брехати:\n«Нагорі? Ні. Наш Рай на сім метрів нижче рівня моря».<\/p><p>«Щоночі ми його відкачуємо. Разом. Без пафосу.\nБог створив світ, а Нідерланди створили ми.\nРай не дають згори. Його тримають дамбою».<\/p><p>І я подивився на дамбу та впізнав себе:\nми теж щоночі відкачуємо темряву,\nтільки з іронією замість вітряків.<\/p><p>Тут мій зір зустрівся з голландським світлом Рембрандта,\nі рухало мене вже не кохання, що рухає сонце й інші зорі,\nа світло, що вмикається за графіком. І зорі.<\/p><p class=\"hush\">Тссс. Отець Андрій ще спить.<\/p>"}]}, {"id": "lytsar", "kick": "Книга друга", "title": "Лицар", "about": "Драма в діях, що пишуться наживо: лицар вирішує, шо і за чим. У другій дії — тричі змінені плани, дві богині й бал для одного глядача.", "kind": "drama", "ongoing": true, "tbc": "Наступна дія виходить, коли лицар вирішить, шо і за чим. Машина чекає надворі.", "chapters": [{"id": "v1", "title": "Інтерлюдія. «Мій Вергілій»", "html": "<p class=\"dir\">Котляревський передає лицаря тому, хто заповів.<\/p><p>На вершині Ягодина, де закінчується черга,<br>Котляревський зняв шапку, витрусив з люльки попіл<br>і сказав: «Далі не я. Далі той, хто заповів».<\/p><p>З-за прикордонної будки вийшов він, у кожусі,<br>з вусами, що бачили більше доріг, ніж мапа,<br>і з торбою, де лежало одне-єдине слово.<\/p><p>«Тарасе Григоровичу», — почав я і затнувся.<br>«Без церемоній, — усміхнувся він. — Мені колись<br>десять років не дозволяли писати. Я писав».<\/p><p>«Куди ви мене поведете?» — «Нікуди. Я веду не ногами.<br>У мене був один шлях, на заслання, через степ.<br>У тебе їх багато. Обирай, а я ітиму поруч».<\/p><p>Я показав йому мапу: Абкауде, Краків, Кіпр,<br>дрони за десять хвилин від хати, п'ять мов у телефоні.<br>Він довго дивився, а тоді сказав: «Оце й є сім'я велика».<\/p><p>«Я ж заповідав: в сім'ї вольній, новій<br>не забудьте пом'янути незлим тихим словом.<br>Не знав, що сім'я розійдеться по світу. Але знав, що буде».<\/p><p>«Ти не мусиш тягнути моє слово, як хрест.<br>Неси його, як квиток: показуй на кожному кордоні.<br>Слово, яке подорожує, не забувається».<\/p><p>Він перейшов зі мною кордон легко, без печатки,<br>бо мертвих поетів на митниці не обшукують.<br>А в торбі в мене стало на одне слово більше.<\/p>"}, {"id": "d1", "title": "Дія перша. «Не земля, а черговість»", "html": "<p class=\"dir\">Лицар вирушає не видивлятися нову землю, а вирішувати, шо і за чим робити.<\/p><ul class=\"cast\"><li><b>ЛИЦАР СУМНОГО КАПЮШОНА<\/b><\/li><li><b>СТЕЛЯ<\/b>, нідерландська, біла, з одним швом посередині, як меридіан<\/li><li><b>ПОЛИЦЯ<\/b>, на якій акуратно складене минуле<\/li><li><b>ГАЧКИ<\/b>, наполовину порожні<\/li><li><b>ХОР<\/b> українського народу, за кадром, у телефоні<\/li><li><b>ПОЛІЦІЯ ВАЙБІВ<\/b>, ШІ-асистована<\/li><\/ul><p class=\"dir\">Кімната. 22:39. Камера дивиться в стелю, бо стеля тут єдине, що не треба вирішувати. У віконці відеодзвінка ЛИЦАР дивиться вгору. Так дивиться святий на бароковому полотні, коли йому сказали, що чудо буде, але спершу треба заповнити форму.<\/p><div class=\"role\">Лицар<\/div><p class=\"line\">Колумб шукав землю. Еней шукав землю.\nЯ свою вже знайшов: вона пласка\nй лежить нижче рівня моря.\nМені лишилось дрібне. Вирішити, шо і за чим.\nСпершу дах чи робота? Робота чи мова?\nМова чи серце?<\/p><p class=\"dir\">(пауза)<\/p><p class=\"line\">Серце, як відомо, без BSN не реєструють.<\/p><div class=\"role\">Хор <i>(з телефона, ритмічно)<\/i><\/div><p class=\"line\">Шо і за чим! Шо і за чим!\nМама питає, чи ти поїв!<\/p><div class=\"role\">Стеля <i>(рівно, без емоцій)<\/i><\/div><p class=\"line\">Eerst koffie.<\/p><div class=\"role\">Полиця<\/div><p class=\"line\">Я вже склала одяг. Бачиш?\nВирішувати можна по одній речі.<\/p><p class=\"dir\">Входить ПОЛІЦІЯ ВАЙБІВ і козиряє екраном.<\/p><div class=\"role\">Поліція вайбів<\/div><p class=\"line\">Рапорт. Вайб м'який,\nале досить гострий, щоб помітити.\nПрихована нота ангостури.<\/p><div class=\"role\">Лицар<\/div><p class=\"line\">Ангостура гірка. Але без кількох крапель\nкоктейль не тримає форми.<\/p><div class=\"role\">Хор<\/div><p class=\"line\">То шо ж перше?!<\/p><div class=\"role\">Лицар <i>(так і не відводить очей від стелі)<\/i><\/div><p class=\"line\">Перше вирішено: я не вирішуватиму все сьогодні.<\/p><p class=\"dir\">Ліворуч синя штора м'яко падає замість завіси. Надворі під ліхтарем стоїть припаркований велосипед. На ньому, без рук і з парасолькою, сидить Deus ex machina і терпляче чекає другої дії.<\/p><p class=\"curtain\">ЗАВІСА<\/p>"}, {"id": "i1", "title": "Інтерлюдія. «Виховна година»", "html": "<p class=\"dir\">Рандомний діалог.<\/p><p>Чат групи. Одинадцята сорок три. За вікном Нідерланди, на сковорідці млинець.<\/p><p>— Шановні, — пише староста. — Повписуйте оцінки.<\/p><p>— А якщо не пам'ятаю? — питає найкращий зам.<\/p><p>— Я теж не пам'ятаю... — зізнається ще хтось.<\/p><p>Ветеран відкладає виделку. Не повністю, а рівно настільки, щоб звільнити один палець.<\/p><p>— Якщо не будете слухатися старосту, в особисті приходитиму я.<\/p><p>Пауза. Хтось друкує, стирає, знову друкує.<\/p><p>— ЗАПИСУЙТЕ, — пише найкращий зам, і це звучить як присяга.<\/p><p>Ветеран повертається до млинця. Гостренький, із бананом, а в навушниках туц-туц власного радіо.<\/p><p>— Смакота, — думає він.<\/p><p>І більше нічого не думає. Порядок наведено, млинець теплий, світ на місці. Виховна година тривала чотири хвилини, і це була найкоротша виховна година в історії педіатрії.<\/p>"}, {"id": "d2", "title": "Дія друга. «Тричі за годину, або Бал у Абкауде»", "html": "<p class=\"hush\">Жіноче в чоловікові — це дозвіл на вразливість без утрати себе. Покора, яку вибираєш сам, уже не покора, а жест.<\/p><p class=\"pr\"><a class=\"pill\" href=\"https://youtu.be/6dIB8vev-9E\" target=\"_blank\" rel=\"noopener\">▶ Слухати в авторському читанні ↗<\/a><\/p><p class=\"pr\">Ой у славнім Абкауде, де вітряки крутяться, а сусіди здороваються з качками, сидів козак Андрійко над кавою. Опівдні з'явилися йому дві богині.<\/p><p class=\"pr\">Перша — <b>Афродіта<\/b>: платиновий блиск, байкерська куртка, голос з хрипотою, наче вона щойно розбила серце й дискотеку разом. Друга — <b>Діана<\/b>: ступала, як мисливиця по подіуму, і кожен її крок падав на підлогу, мов вирок.<\/p><p class=\"pr\">— Що, козаче, — мовила Афродіта, — куди серце тягне?\n— До війська, — каже козак. — До голландського.\n— Ох, — засміялась Діана й перевірила тятиву. — Туди тільки з голландським паспортом. Закон, козаче. Цілюсь я влучно, та паспорта не дам.<\/p><blockquote class=\"chorus\"><i>Приспів:<\/i>\nВітряки крутяться — а плани ще швидше,\nодна година — і світ уже інший,\nхто сьогодні солдат — завтра в оборонці,\nа післязавтра ночує в Кракові при сонці.<\/blockquote><h3 class=\"sub\">Зміна перша<\/h3><p class=\"pr\">Почухав козак чуба:\n— Тоді в оборонку! Європа велика!<\/p><p class=\"pr\">Пішов він по світу, як по каталогу. У Данії — радари й гелікоптерні інженери. У Дуйвендрехті, за десять хвилин від хати, — DeltaQuad: шукають інструктора з дронів.\n— Оце моє! — вигукнув козак. — Я ж на FlyEye літав!\n— А права водійські маєш? — спитала Діана.\n— Нема.\n— А ліцензію A1/A3?\n— Буде.\n— А п'ять років на крилатих машинах, як хоче Destinus?\n— Місяць. Зате бойовий.<\/p><p class=\"pr\">Афродіта погладила його по голові:\n— Нічого, серденько. Чесний лист кращий за брехливе резюме.<\/p><p class=\"pr\">А тоді з'явилася вакансія від Auterion, гарна, як різдвяна листівка. Тільки в Цюриху, і тільки для громадян ЄС.\n— Ну, Швейцаріє, — зітхнув козак, — тебе я теж відпускаю.<\/p><h3 class=\"sub\">Зміна друга<\/h3><p class=\"pr\">Аж тут Діана глянула на календар:\n— Козаче, а в суботу ти де ночуєш?<\/p><p class=\"pr\">Бо домовився козак з Давидом з Абкауде на два тижні, а козацьке слово — не голландська погода, не змінюється за годину.<\/p><p class=\"pr\">Знайшов він готель модний, з коворкінгом і реєстрацією за адресою, просто мрія. Глянув на ціну: <b>двісті шістдесят євро за ніч<\/b>.\n— Я, — каже козак тихо, — в овердрафті, богине.<\/p><blockquote class=\"chorus\"><i>Приспів (тихіше, під акустику):<\/i>\nДвісті шістдесят — то не ціна, а вирок,\nа в банку мінус, як у полі вирва,\nта в кишені — квиток до Кракова на суботу,\nбо козак, навіть сам того не знаючи, планував наперед.<\/blockquote><p class=\"pr\">— Стоп, — сказала Афродіта. — У тебе вже є квиток до Кракова?\n— Є.\n— То чого ж ми в Амстердамі житло шукаємо?<\/p><h3 class=\"sub\">Інтермецо: бал у Абкауде<\/h3><p class=\"pr\">Діана зняла лук і поставила його до вітряка, як мікрофон на стійку. Афродіта ввімкнула біт, низький і рівний, наче серце, яке знає, куди йде.<\/p><p class=\"pr\">— <b>Catwalk!<\/b> — крикнула Діана.<\/p><p class=\"pr\">І козак пішов. Не маршем, як учили на плацу, а від стегна: плечі розслаблені, підборіддя вгору, наче шлях до голландського війська стелиться прямо під ноги.<\/p><p class=\"pr\">— <b>Hands!<\/b><\/p><p class=\"pr\">Долоні пішли малювати в повітрі: Данію, радари, гелікоптери. Пальці склалися в рамку й показали DeltaQuad, за десять хвилин від хати. І тут же рука, не зупиняючись, перетекла у відмову: <i>п'ять років досвіду? ні.<\/i> Козак не обірвав жест, а дозволив йому вилитися в наступний.<\/p><p class=\"pr\">— <b>Duckwalk!<\/b><\/p><p class=\"pr\">Присів низько, на самих носках, і пішов до Цюриха. Дорогою зрозумів: <i>лише для громадян ЄС<\/i>. І крутнувся на місці так, що Швейцарія лишилась позаду, як шлейф.<\/p><p class=\"pr\">— <b>Spin! — і — DIP!<\/b><\/p><p class=\"pr\">Двісті шістдесят євро за ніч. Він закрутився, підняв ногу і впав на спину. Не від поразки, а як падають у вогінгу, коли падіння є найвищою точкою номера. Підлога прийняла його, як прийняла б будь-кого в овердрафті, хто не втратив стилю.<\/p><p class=\"pr\">Зала завмерла.<\/p><p class=\"pr\">— Ну? — спитала Діана. — Встанеш?<\/p><p class=\"pr\">А козак лежав і усміхався. Він згадав: квиток до Кракова вже в кишені.<\/p><p class=\"pr\">— <b>Floor performance<\/b>, — прошепотіла Афродіта.<\/p><p class=\"pr\">І він підвівся. Не ривком, а хвилею: від підлоги до колін, від колін до стегон, від стегон до піднятої руки. Цим одним рухом він опинився на нарах Dizzy Daisy за п'ятдесят п'ять євро.<\/p><blockquote class=\"chorus\">Бо вогінг — не «чоловіче» чи «жіноче»,\nа перетікання з одного в інше,\nколи тобі кажуть позу, а ти\nвже стоїш в іншій,\nі це — не зрада першої,\nа її продовження.<\/blockquote><p class=\"pr\">Діана повільно, по-подіумному, кивнула й назвала оцінку:<\/p><p class=\"pr\">— <b>Tens. Tens. Tens across the board.<\/b><\/p><h3 class=\"sub\">Зміна третя<\/h3><p class=\"pr\">Написав козак побратимові по дотепах, що живе в Празі:\n— Можна в тебе на дивані два тижні?\n— Два тижні — то багато, — відповів побратим. — І в мене на роботі свій бал, без музики.\n— Ну шо ж, ти впораєшся, — відписав козак. — Підкажу, як шо.\n— Подумаю і напишу ввечері.<\/p><p class=\"pr\">Не тиснув козак, бо знав: дружбу, як і хостел, краще бронювати з безкоштовним скасуванням.<\/p><p class=\"pr\">І знайшов він у Кракові <b>Dizzy Daisy<\/b> — п'ять ночей за <b>п'ятдесят п'ять євро<\/b>, ліжко на другому поверсі нар, заїзд з третьої до четвертої. Хостел підтвердив, і доплачувати не треба.<\/p><p class=\"pr\">А наостанок, як справжній козак, що з бою виходить з трофеєм, сів він писати лист до <b>WB Group<\/b>, тих самих, що роблять FlyEye:\n— Я ваш дрон у полі тримав, тепер хочу бути корисним.<\/p><p class=\"pr\">Діана опустила лук:\n— Оце постріл.<\/p><blockquote class=\"chorus\"><i>Фінальний приспів (усі разом, з вітряками на бек-вокалі):<\/i>\nОпівдні — в армію, о першій — до хостелу,\nміж ними — Данія, Цюрих і крила над полем,\nтри плани за годину — не хаос, а танець,\nбо козак не губиться — козак обирає.<\/blockquote><h3 class=\"sub\">Мораль<\/h3><p class=\"pr\">Пішли богині, лишивши по собі блиск і запах кави. Козак допив свою. Плани на життя мінялися тричі, але щоразу лишалися три речі: квиток, чесність і бажання бути корисним.<\/p><p class=\"pr\">А в суботу о третій він заїде в хостел у Кракові.<\/p><h3 class=\"sub\">Бал для одного глядача<\/h3><p class=\"pr\">Увечері в Абкауде богині вже пішли, а біт лишився: тихий, з кухонної колонки, поруч із чайником.<\/p><p class=\"pr\">Давид сидів на дивані з чашкою, як суддя, що прийшов на бал випадково і лишився назавжди.<\/p><p class=\"pr\">— Покажи, — сказав він. — Те, що ти сьогодні робив.<\/p><p class=\"pr\">Козак став посеред кімнати, між рюкзаком і вітряком на підвіконні, і почав.<\/p><div class=\"bal-stage\" tabindex=\"0\"><\/div><p class=\"pr\"><b>Catwalk<\/b> — від дверей до столу: крок від стегна, підборіддя вгору, як колись на плацу, тільки тепер про красу, а не про стрій.<\/p><p class=\"pr\"><b>Hands<\/b> — долоні намалювали в повітрі Данію, Цюрих і дрон над полем, а тоді склалися в рамку, і в рамці опинився Давид.<\/p><p class=\"pr\"><b>Duckwalk<\/b> — низенько, на носках, до самого дивана. Давид підібрав ноги й засміявся вперше за вечір.<\/p><p class=\"pr\"><b>Spin — і dip.<\/b> Козак упав на килим, на спину, з піднятою рукою. Це не поразка — найвища точка номера.<\/p><p class=\"pr\">Тиша. Чайник клацнув.<\/p><p class=\"pr\">— Ну? — спитав козак з підлоги.<\/p><p class=\"pr\">Давид поставив чашку, нахилився й дуже серйозно, по-голландськи, показав десять пальців.<\/p><p class=\"pr\">— Tien. Tien. Tien.<\/p><p class=\"pr\">А козак лежав і думав: у суботу Краків, хостел за п'ятдесят п'ять, лист до WB Group. Плани мінялися тричі, але цей глядач, хоч би де, — не змінювався.<\/p><p class=\"pr\">Він підвівся хвилею, від килима до піднятої руки, і закінчив номер саме там, де Давид міг її взяти.<\/p><details class=\"perf\"><summary>Тричі за годину — коротка версія для виконання вголос (~1 хв)<\/summary><p class=\"dir\">Діана кличе, козак відповідає, зала відбиває такт. Чим коротші команди Діани і чим ширші паузи перед «DIP» і «Floor», тим сильніше спрацьовує.<\/p><p class=\"line\"><b>ДІАНА:<\/b> Catwalk!\n<b>КОЗАК:<\/b>\nОпівдні — до війська, крок від стегна,\nта паспорт не той — і закрита стіна.\nНе падаю — <b>йду.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b> Hands!\n<b>КОЗАК:<\/b>\nМалюю в повітрі Данію й дрони,\nDeltaQuad, радари, чужі кордони.\nВідмова? — то жест. Я веду його <b>далі.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b> Duckwalk!\n<b>КОЗАК:<\/b>\nНизенько, на носках — аж до Цюриха,\n«лише громадянам» — і я крутнувся тихо.\nШвейцарія — шлейф. <b>За спиною.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b> Spin!\n<b>КОЗАК:<\/b>\nДвісті шістдесят за одну ніч —\n<b>ДІАНА:<\/b> DIP!\n<b>КОЗАК:<\/b> <i>(падає)<\/i>\n…і я лежу. І це — не кінець.\nЦе — <b>вершина номера.<\/b><\/p><p class=\"line\"><i>(пауза. біт тихне)<\/i><\/p><p class=\"line\"><b>АФРОДІТА:<\/b> <i>(пошепки)<\/i> Floor.\n<b>КОЗАК:<\/b> <i>(підводиться хвилею)<\/i>\nВід підлоги — до коліна,\nвід коліна — до стегна,\nвід стегна — до руки над головою:\nу кишені — <b>Краків.<\/b>\nП'ятдесят п'ять євро.\nНари. Субота. Третя дня.<\/p><p class=\"line\"><b>ЗАЛА:<\/b> <i>(в один голос)<\/i>\nКажуть позу —\n<b>ти вже в іншій.<\/b>\nЦе не зрада —\n<b>це продовження.<\/b><\/p><p class=\"line\"><b>ДІАНА:<\/b>\nTens.\nTens.\n<b>Tens across the board.<\/b><\/p><p class=\"line\"><i>(світло гасне на піднятій руці)<\/i><\/p><\/details><p class=\"pr\"><a class=\"pill\" href=\"https://youtu.be/6dIB8vev-9E\" target=\"_blank\" rel=\"noopener\">▶ Слухати в авторському читанні ↗<\/a><\/p>"}, {"id": "i4", "title": "Інтерлюдія. «Слухняний хлопчик»", "html": "<p class=\"dir\">Рандомний діалог від пана Андрійка.<\/p><p>Після обіду. Кава вже холодна, телевізор бубонить щось нідерландською, і ніхто його не слухає.<\/p><p>Козак сидів на підлозі, спиною до дивана, між колінами свого чоловіка. Той мовчки перебирав йому волосся. Великі руки, повільні, такі, що нікуди не поспішають.<\/p><p>— Знаєш, — сказав козак, не обертаючись, — я сьогодні дещо виявив.<\/p><p>— Ну?<\/p><p>— Що бути слухняним хлопчиком — це класно. Коли поруч хтось великий і добрий.<\/p><p>Чоловік засміявся тихо, грудьми, так, що козак відчув це потилицею.<\/p><p>— Слухняним? Ти? Ти за годину тричі змінив плани на життя.<\/p><p>— Плани — так. А тут — ні.<\/p><p>Помовчали. Рука в волоссі не зупинилася.<\/p><p>— Тільки є одне правило, — сказав козак уже тихіше, ніби собі. — Слухняність має лишатися радістю. Не способом заслужити, щоб тебе не відпустили.<\/p><p>Чоловік нахилився і поцілував його в маківку. Нічого не сказав, бо голландці взагалі рідко кажуть зайве.<\/p><p>А козак подумав: ось воно. Покора, яку вибираєш сам, — уже не покора, а жест. І цей жест він дарує не тому, що боїться, а тому, що може.<\/p><p>Телевізор досі бубонів. Кава досі була холодна. І нікому з них не треба було нікуди йти. Принаймні до суботи.<\/p>"}, {"id": "i2", "title": "Інтерлюдія. «Легенда про монокль»", "html": "<p class=\"dir\">Легенда.<\/p><p>Кажуть, у старого годинникаря з Абкауде був монокль, який він ніколи не знімав. Діти думали, що це для краси. Насправді монокль був чарівний, хоч чари в ньому були найпростіші: він навчив свого власника, що дивитися можна по-різному і що це вибір.<\/p><p>Коли годинникар дивився лівим оком, крізь скельце, світ ставав близьким і дрібним. Він бачив кожен гвинтик, кожну подряпину, кожну зморшку на руці клієнта. Так він ремонтував годинники, і так слухав людей, коли їм було боляче: зблизька, без поспіху, по одній деталі.<\/p><p>Коли дивився правим оком, голим, світ ставав широким і далеким. Він бачив усю вулицю, вітряки, небо над польдером і те, куди все це рухається. Так він вирішував, що робити далі.<\/p><p>Коли розплющував обидва, з'являлася глибина. Близьке й далеке складалися в одну картину, і тоді годинникар розумів речі, яких не бачив жодним оком окремо: що дрібна подряпина — це частина великої дороги, а велика дорога складається з дрібних подряпин.<\/p><p>А іноді він заплющував обидва й не дивився взагалі. Це був нуль. Сусіди думали, що старий задрімав. Але в нулі годинникар слухав, як цокають усі годинники в майстерні разом, і відпочивав від необхідності бачити.<\/p><p>Учень якось спитав: «Майстре, а яке око правильне?» Годинникар усміхнувся: «Жодне. Правильне — це вміти перемикатися свідомо. Хто дивиться лише зблизька, тоне в дрібницях. Хто лише здалеку, не помічає людей. Хто завжди обома, втомлюється. А хто ніколи не заплющує очей, той забуває, як звучить час».<\/p><p>Відтоді в Абкауде кажуть: якщо світ раптом здається занадто близьким чи занадто далеким, не міняй світ. Перемкни об'єктив.<\/p>"}, {"id": "i3", "title": "Інтерлюдія. «Виховна бесіда на гейському фронті»", "html": "<p class=\"dir\">Раптова вставка малої прози.<\/p><p>Вечір. Ветеран сидить на кухні, телефон у руці, на екрані тред, який він сам і написав.<\/p><p>Унизу хтось коментує, грубо й коротко, як усі в інтернеті, хто прочитав тільки заголовок.<\/p><p>Ветеран не злиться. Він знає цей жанр: так пишуть ті, хто ще не мав де бути м'яким.<\/p><p>І він дописує, вже не для того коментатора, а для когось молодшого, хто, може, читає мовчки, не лайкає й боїться, що про нього здогадаються:<\/p><p class=\"solo\">«Це коли ти можеш бути вразливим зі своїм чоловіком».<\/p><p>Він довго дивиться на цей рядок. Колись він думав, що сила — це не хапатися ні за кого. Що безпечно тільки тоді, коли нікому не дозволяєш себе тримати.<\/p><p>А виявилося навпаки. Безпечно — це коли можна схопитися за руку без остраху. Коли тебе не відпускають за те, що ти слабкий. Коли «слухняний» означає «довіряю», а не «боюся».<\/p><p>Він натискає «Опублікувати». Десь у Києві, в Харкові, в окопі під Покровськом хтось молодий читає це й уперше думає: а може, і мені так можна.<\/p><p>Ветеран відкладає телефон. З кімнати чути, як Давид перемикає канали. Чайник ще теплий.<\/p><p>Виховна бесіда завершена. Ніхто не постраждав. Хтось, можливо, видихнув.<\/p>"}, {"id": "i5", "title": "Інтерлюдія. «Бібліотека, а не аптека»", "html": "<p class=\"dir\">Записка.<\/p><p>Ранок у Богомольця починається з чату групи. Староста просить вписати оцінки, хтось не пам'ятає, хтось пам'ятає, але не хоче, хтось уже третю ніч не спить перед модулем і пише «ахахах» так, що за цим «ахахах» чути тремтіння.<\/p><p>Ветеран читає це з іншої країни, з гостреньким млинцем у руці. Він знає цю втому: колись носив її в кишені сам.<\/p><p>Учора в чаті хтось попросив: «дайте щось, щоб заснути». І хтось інший уже готовий був поділитися своїм, «працює як годинник». З любові, але помилково: ніби ліки — це цукерка, якою можна поділитися.<\/p><p>Ветеран відписав раніше, ніж устиг подумати: стоп. Бо ліки — це не цукерка. Їх підбирають під одну людину, як ключ під один замок. Чужим ключем замок не відчиниш, а можеш зламати.<\/p><p>Тоді він подумав: а що я можу дати всім? Не з рецепта, а з себе.<\/p><p>І відкрив Discord. Назвав канал «бібліотека практик». Не «аптека», а саме бібліотека: місце, де береш, скільки треба, і повертаєш, коли стане легше.<\/p><p>Він переписав туди вправи з власної книги. Як почати медитувати. Усвідомлене харчування, для тих, хто їсть над конспектом і не помічає, що їсть. Усвідомлена розмова, для тих, кого не чують. Рахунок до десяти, для тих, у кого перед іспитом думки біжать швидше за серце.<\/p><p>А першим постом поставив головне, жирним: «Це бібліотека вправ, а не лікування». І нижче — номери, куди дзвонити, якщо погано вже зараз. І рядок, який він колись хотів би прочитати сам: «Якщо ти на лікуванні, напиши своєму психіатру, навіть якщо здається, що \"не так уже й погано\"».<\/p><p>Він натиснув «Опублікувати» і подумав, що це, мабуть, і є лікарська клятва, тільки без халата: спершу не нашкодь, а потім дай те, що можеш дати безпечно.<\/p><p>Десь у гуртожитку на Кирилівській чи на Пирогова хтось молодий відкриє «Внутрішню тишу» о другій ночі перед КРОКом. Зробить десять вдихів. І вперше за тиждень засне.<\/p><p>Ветеран про це не дізнається. Але бібліотека для того й існує: книжку беруть мовчки.<\/p>"}, {"id": "i6", "title": "Інтерлюдія. «Туга за данським домом»", "html": "<p class=\"dir\">Інтерлюдія для радіо з оркестром.<\/p><p>Вечір. Ноутбук, сто п'ятдесят вкладок, і одна з них грає 88.1.<\/p><p>— «Суміші», — каже ведучий, якого немає. — У студії Рахманінов, за пультом мозок Баха. А сьогодні з ними третій: туга Андрійка за данським домом.<\/p><p>Рахманінов, як завжди, приніс мінор. Бах, як завжди, приніс правила. А туга нічого не принесла. Вона просто перемкнула тональність на мажор, і від цього стало ще тужливіше. Так буває з домом, якого немає на мапі: про нього не плачуть у мінорі, про нього співають у мажорі, повільно, щоб устигнути запам'ятати.<\/p><p>Мелодія проста, як хорал у данській сільській церкві, де співають усі, навіть ті, хто не вміє. Шістнадцять нот: пішла, зупинилася посередині, ніби озирнулася, і повернулася додому. Під нею Бах тихо веде свій голос, на терцію нижче, щоб мелодії не було самотньо.<\/p><p>А перед самим «додому» Рахманінов робить те, що вміє найкраще: на мить кладе мінорну субдомінанту. Один акорд. Музикознавці кажуть, що це запозичений четвертий ступінь. Ветерани кажуть, що це момент, коли ти вже майже вдома, але ще пам'ятаєш дорогу.<\/p><p>Під усім цим дихає море. Не нідерландське, за дамбою, а інше, далі на північ, сіре й чесне. Раз на чотири такти з гавані озивається туманний гудок: низько, довго, ніби хтось кличе човен, який уже повертається.<\/p><p>Ветеран слухає й не питає, де цей дім. Туга не знає географії. Вона знає тільки тональність.<\/p><p>Через вісім тактів Рахманінов забирає мінор назад, Бах починає прелюдію, море тихо відходить. Хорал більше не повториться: на цьому радіо кожен такт пишеться наживо й нікуди не записується.<\/p><p>Як і дім, мабуть. Його не можна записати. Його можна тільки заграти ще раз.<\/p><p class=\"dir\">Один із вечорів записано: <a href=\"https://on.soundcloud.com/Q4qdqaeTLnvOXX42WX\" target=\"_blank\" rel=\"noopener\">послухати на SoundCloud<\/a>.<\/p>"}, {"id": "i7", "title": "Інтерлюдія. «Сенпай»", "new": true, "html": "<p class=\"dir\">Рандомна вставка.<\/p><p>Ветеран лежав у темряві й раптом згадав дитинство. Телевізор, вечірні новини, і на екрані він — президент, сивий, впевнений, такий, що здавалося: дорослі знають, що роблять.<\/p><p>— Він був для мене як сенпай, — сказав ветеран у стелю. — Старший, який, здавалося, все розуміє.<\/p><p>Стеля не відповіла. Стеля була нідерландська й у політику не лізла.<\/p><p>А ветеран подумав, що дорослішання — це коли сенпаї знімаються з п'єдесталів. Не тому, що вони погані, а тому, що ти сам виріс до висоти, з якої видно: ніхто не знає все. І тепер старшим доведеться бути самому.<\/p><p>Він повернувся на бік. Завтра о шостій тест. Сенпай з дитинства не допоможе. Допоможе сон.<\/p>"}]}], "people": [["Лицар сумного капюшона", "Головний герой Книги другої. Знайшов нову землю (пласку й нижче рівня моря) і тепер вирішує, шо і за чим. Дивиться в стелю, як святий з барокового полотна. Перше рішення: не вирішувати все сьогодні."], ["Пан Котляревський", "Вергілій по сумісництву: хто ж іще травестив Вергілія, як не він. Проводить через Пекло й Чистилище, на вершині зупиняється: у Рай пускають тільки з перекладом."], ["Deus ex machina", "Двометровий нідерландський бог. Спускається з небес не на крані, а на велосипеді: без рук, з парасолькою, проти вітру. Дарує строопвафель і F-16, каже «Doe normaal». Знає, що Рай не дають згори, його тримають дамбою. Після першої дії чекає під ліхтарем."], ["Афродіта й Діана", "Дві богині Другої дії. Афродіта — платиновий блиск, байкерська куртка, хрипкий голос. Діана — мисливиця з подіуму: командує вогінгом і ставить оцінки. Паспортів не видають."], ["Давид", "Глядач на дивані з чашкою, суддя балу в Абкауде. Оцінює по-голландськи: десятьма пальцями."], ["Хор українського народу", "За кадром, у телефоні. Говорить ритмічно й хором: «Шо і за чим! Шо і за чим! Мама питає, чи ти поїв!» Головне питання першої дії: «То шо ж перше?!»"], ["А також", "Стеля (нідерландська, біла, з одним швом, як меридіан), Полиця (на ній складене минуле), Гачки (наполовину порожні) і Поліція вайбів (ШІ-асистована)."]], "casting": [["Лицар сумного капюшона", "Роберт Паттінсон", "Каптур і погляд угору він уже відрепетирував у «Бетмені», а самотність і вітер — у «Маяку». Ґотем тут пласкіший і нижче рівня моря."], ["Пан Котляревський", "Остап Ступка", "Люльку й вуса видає костюмерна, «Еней був парубок моторний» він каже без суфлера."], ["Deus ex machina", "Міхіл Гейсман", "До двох метрів трохи бракує, але на велосипеді без рук і з парасолькою цього не видно."], ["Хор українського народу", "Хор імені Верьовки", "За кадром, у телефоні. Репетирує в маминому чаті."], ["Стеля", "Грає сама себе", "Нідерландська, біла, без дублерів."], ["Полиця", "Грає сама себе", "Одяг складала теж сама."], ["Гачки", "Масовка", "Половина на перерві."], ["Поліція вайбів", "Claude, камео", "Рапорт пише сам, ангостуру відчуває на відстані."]]}</script>
<script>
(function(){
  "use strict";
  var B=JSON.parse(document.getElementById("book").textContent);
  var app=document.getElementById("app"),now=document.getElementById("now"),prog=document.getElementById("prog");
  var KEY="vv-komediia";
  var st=(function(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}return o||{};})();
  st.read=st.read||{};st.pos=st.pos||{};st.last=st.last||{};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function br(id){for(var i=0;i<B.branches.length;i++)if(B.branches[i].id===id)return B.branches[i];return null;}
  function key(b,c){return b.id+"/"+c.id;}
  function doneIn(b){return b.chapters.filter(function(c){return st.read[key(b,c)];}).length;}
  function nextIn(b){var l=st.last[b.id];if(l){for(var i=0;i<b.chapters.length;i++)if(b.chapters[i].id===l&&!st.read[key(b,b.chapters[i])])return b.chapters[i];}
    for(var j=0;j<b.chapters.length;j++)if(!st.read[key(b,b.chapters[j])])return b.chapters[j];return l?(b.chapters.filter(function(c){return c.id===l;})[0]||b.chapters[0]):b.chapters[0];}

  /* font size, kept on this device */
  var fs=+(st.fs||19);function applyFs(){document.documentElement.style.setProperty("--fs",fs+"px");}applyFs();
  document.getElementById("fsm").onclick=function(){fs=Math.max(15,fs-1);st.fs=fs;save();applyFs();};
  document.getElementById("fsp").onclick=function(){fs=Math.min(26,fs+1);st.fs=fs;save();applyFs();};

  function home(){
    now.textContent="Безкінечна читалка";document.title=B.title+" · Вайбкет FM";
    var h='<section class="cover"><div class="kick">Вайбкет FM · Відділ великої літератури</div><h1>'+esc(B.title)+'</h1><p class="sub">'+esc(B.sub)+'</p>'+
      '<div class="au">'+esc(B.author)+'<br><span style="color:var(--dim)">'+esc(B.series)+'</span></div><div class="bike" aria-hidden="true">🚲☂️</div>'+
      '<div class="off">📴 читається без інтернету · прогрес лише на цьому пристрої</div></section>';
    var lb=st.lastBranch&&br(st.lastBranch);
    if(lb){var c=nextIn(lb);h+='<div class="cont"><a class="cta" href="#'+lb.id+'/'+c.id+'">Продовжити: '+esc(lb.title)+' · '+esc(c.title.split(".")[0])+' →</a></div>';}
    h+='<h2 class="sect">Сюжетні гілки · читай будь-яку окремо</h2><div class="branches">';
    B.branches.forEach(function(b){
      var d=doneIn(b),n=b.chapters.length,fresh=b.chapters.some(function(c){return c.new&&!st.read[key(b,c)];});
      h+='<a class="br" href="#'+b.id+'"><small>'+esc(b.kick)+(b.ongoing?' · пишеться наживо':'')+'</small>'+(fresh?' <span class="new">● нове</span>':'')+
        '<b>'+esc(b.title)+'</b><p>'+esc(b.about)+'</p><div class="meta"><span>'+n+' '+(b.kind==="drama"?(n===1?"дія":"дії"):(n<5?"пісні":"пісень"))+'</span><span>'+(d===n?"прочитано ✓":d?"прочитано "+d+" з "+n:"ще не почато")+'</span></div>'+
        '<div class="bar"><i style="width:'+(n?d/n*100:0)+'%"></i></div></a>';
    });
    h+='</div><h2 class="sect">Додатки</h2><div class="extra"><a class="pill" href="#osoby">🎭 Дійові особи</a><a class="pill" href="#kasting">🎬 Кастинг</a>'+
      (Object.keys(st.read).length?'<button class="pill" id="reset">↺ почати все спочатку</button>':'')+'</div>'+
      '<div class="end">'+esc(B.hush)+'<br>Данте, Котляревський і голландські дамби справжні, решта на совісті Мінвайбкету.</div>';
    app.innerHTML=h;
    var r=document.getElementById("reset");if(r)r.onclick=function(){if(confirmIn(r)){st.read={};st.pos={};st.last={};st.lastBranch=null;save();home();}};
  }
  function confirmIn(btn){if(btn.dataset.sure){return true;}btn.dataset.sure=1;btn.textContent="↺ точно? натисни ще раз";setTimeout(function(){if(btn.isConnected){delete btn.dataset.sure;btn.textContent="↺ почати все спочатку";}},3000);return false;}

  function branch(b){
    now.textContent=b.kick+" · "+b.title;document.title=b.title+" · "+B.title;
    var h='<div class="chap"><div class="kick">'+esc(b.kick)+'</div><h1>'+esc(b.title)+'</h1><p class="dir" style="font-style:normal">'+esc(b.about)+'</p><ul class="toc">';
    b.chapters.forEach(function(c){var r=st.read[key(b,c)],p=st.pos[key(b,c)];
      h+='<li class="'+(r?"done":"")+'"><a href="#'+b.id+'/'+c.id+'"><span>'+esc(c.title)+(c.new&&!r?' <span class="new">● нове</span>':'')+'</span><span class="st">'+(r?"✓":p>.05?Math.round(p*100)+"%":"")+'</span></a></li>';});
    h+='</ul>'+(b.tbc?'<div class="tbc"><b>Далі буде</b>'+esc(b.tbc)+'<div style="font-size:26px;margin-top:8px">🚲☂️</div></div>':'')+'<div class="nav"><a href="#"><small>←</small>Усі гілки</a>'+
      '<a class="nx" href="#'+b.id+'/'+nextIn(b).id+'"><small>'+(doneIn(b)?"продовжити":"почати")+' →</small>'+esc(nextIn(b).title)+'</a></div></div>';
    app.innerHTML=h;
  }

  var cur=null,restoreY=0,openedAt=0,dwellT=0;
  function chapter(b,c){
    var i=b.chapters.indexOf(c),pv=b.chapters[i-1],nx=b.chapters[i+1];
    now.textContent=b.title+" · "+c.title;document.title=c.title+" · "+B.title;
    st.last[b.id]=c.id;st.lastBranch=b.id;save();
    var h='<article class="chap '+(b.kind==="verse"?"verse":"drama")+'"><div class="kick">'+esc(b.kick)+' · '+esc(b.title)+'</div><h1>'+esc(c.title)+'</h1>'+c.html+'</article>';
    if(!nx&&b.tbc)h+='<div class="tbc"><b>Далі буде</b>'+esc(b.tbc)+'<div style="font-size:26px;margin-top:8px">🚲☂️</div></div>';
    h+='<div class="nav">'+(pv?'<a href="#'+b.id+'/'+pv.id+'"><small>← назад</small>'+esc(pv.title)+'</a>':'<a href="#'+b.id+'"><small>← зміст</small>'+esc(b.title)+'</a>')+
      (nx?'<a class="nx" href="#'+b.id+'/'+nx.id+'"><small>далі →</small>'+esc(nx.title)+'</a>':'<a class="nx" href="#"><small>кінець гілки →</small>Інші гілки</a>')+'</div>';
    app.innerHTML=h;cur={b:b,c:c};try{[].forEach.call(app.querySelectorAll(".bal-stage"),function(x){window.VV_BAL&&VV_BAL(x);});}catch(e){}openedAt=Date.now();clearTimeout(dwellT);dwellT=setTimeout(tick,3100);
    restoreY=st.pos[key(b,c)]||0;
    requestAnimationFrame(function(){var hh=document.documentElement.scrollHeight-innerHeight;window.scrollTo(0,restoreY>0.02&&restoreY<.97?restoreY*hh:0);tick();});
  }
  function others(id){
    if(id==="osoby"){now.textContent="Дійові особи";app.innerHTML='<div class="chap"><div class="kick">Додаток</div><h1>Дійові особи</h1><dl class="people">'+
      B.people.map(function(p){return '<dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd>';}).join("")+'</dl><div class="nav"><a href="#"><small>←</small>Усі гілки</a><a class="nx" href="#kasting"><small>→</small>Кастинг</a></div></div>';}
    else{now.textContent="Кастинг";app.innerHTML='<div class="chap"><div class="kick">Додаток</div><h1>Кастинг</h1><p class="note">неофіційний · у мріях Мінвайбкету · агентів ще не повідомлено</p><dl class="people">'+
      B.casting.map(function(p){return '<dt>'+esc(p[0])+'</dt><dd><b style="color:var(--ivory)">'+esc(p[1])+'.</b> '+esc(p[2])+'</dd>';}).join("")+'</dl><div class="nav"><a href="#osoby"><small>←</small>Дійові особи</a><a class="nx" href="#"><small>→</small>Усі гілки</a></div></div>';}
  }

  function route(){
    cur=null;var h=decodeURIComponent(location.hash.replace(/^#/,"")).split("/");
    var b=br(h[0]);
    if(h[0]==="osoby"||h[0]==="kasting")others(h[0]);
    else if(b&&h[1]){var c=b.chapters.filter(function(x){return x.id===h[1];})[0];if(c){chapter(b,c);return;}branch(b);}
    else if(b)branch(b);else home();
    window.scrollTo(0,0);tick();
  }
  var tt=0;
  function tick(){
    var hh=document.documentElement.scrollHeight-innerHeight,y=hh>0?Math.max(0,Math.min(1,scrollY/hh)):1;
    prog.style.width=(cur?y*100:0)+"%";
    if(!cur)return;
    var k=key(cur.b,cur.c);
    if((y>=.97||hh<=8)&&Date.now()-openedAt>3000){if(!st.read[k]){st.read[k]=1;}}
    st.pos[k]=y;clearTimeout(tt);tt=setTimeout(save,300);
  }
  addEventListener("scroll",tick,{passive:true});addEventListener("resize",tick);
  addEventListener("hashchange",route);
  addEventListener("pagehide",save);
  /* "← Вайбкет FM" always leaves the reader; "↑ зміст" steps up inside it */
  var up=document.getElementById("up");
  function paintUp(){var h=location.hash.replace(/^#/,"").split("/");up.hidden=!h[0];up.href=h.length>1&&h[1]?"#"+h[0]:"#";up.textContent=h.length>1&&h[1]?"↑ зміст":"↑ усі гілки";}
  addEventListener("hashchange",paintUp);paintUp();

  document.addEventListener("keydown",function(e){
    if(!cur||e.metaKey||e.ctrlKey||e.altKey||/input|textarea/i.test((e.target.tagName||"")))return;
    var i=cur.b.chapters.indexOf(cur.c);
    if(e.key==="ArrowRight"&&cur.b.chapters[i+1])location.hash=cur.b.id+"/"+cur.b.chapters[i+1].id;
    if(e.key==="ArrowLeft"&&cur.b.chapters[i-1])location.hash=cur.b.id+"/"+cur.b.chapters[i-1].id;
  });
  route();
})();
</script>
</body>
</html>
