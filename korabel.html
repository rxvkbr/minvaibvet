<script>
(function(){
"use strict";
var TX=window.KORABEL_TEXT,LANGS=["uk","en","nl","ru","ar","zh"],LN="uk";
try{LN=localStorage.getItem("lang")||"uk";}catch(e){}
if(!TX[LN])LN="en";
function T(){return TX[LN];}
function fmt(s,o){for(var k in o)s=s.split("{"+k+"}").join(o[k]);return s;}
var $=function(id){return document.getElementById(id);};
var STAGES=["keel","frames","engine","plating","deck","prop","bridge","funnel","paint","launch"];
var COLS=["#2f8fe0","#ffc43d","#3bb58a","#f4f1ea"],RED="#e2553f",STEEL="#9aa7b1";

/* ---------------- state ---------------- */
var S;
function fresh(){return {stage:0,n:0,riv:0,color:-1,dryUntil:0,painted:false,name:"",start:Date.now(),ate:false,x2:0,done:false,lang:LN};}
try{S=JSON.parse(localStorage.getItem("korabel")||"null");}catch(e){S=null;}
if(!S||typeof S.stage!=="number")S=fresh();
function save(){try{localStorage.setItem("korabel",JSON.stringify(S));}catch(e){}}

/* ---------------- sound: bright, warm, major ---------------- */
var AC=null,MAS=null,DEL=null;
function ac(){
  if(AC)return AC;
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  AC=new C();MAS=AC.createGain();MAS.gain.value=.55;MAS.connect(AC.destination);
  DEL=AC.createDelay(1);DEL.delayTime.value=.19;var fb=AC.createGain();fb.gain.value=.28;var lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=6000;
  var wet=AC.createGain();wet.gain.value=.3;DEL.connect(lp);lp.connect(fb);fb.connect(DEL);lp.connect(wet);wet.connect(MAS);
  return AC;
}
function wake(){var c=ac();if(c&&c.state!=="running")try{c.resume();}catch(e){}}
function bell(f,t,v,d){var c=ac();if(!c)return;t=t||c.currentTime;d=d||1.2;
  [[1,1],[2.01,.35],[3.0,.12],[4.2,.06]].forEach(function(p){var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f*p[0];
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*p[1],t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d/p[0]*1.2);
    o.connect(g);g.connect(MAS);g.connect(DEL);o.start(t);o.stop(t+d+.1);});}
function pluck(f,t,v){var c=ac();if(!c)return;t=t||c.currentTime;var o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(MAS);g.connect(DEL);o.start(t);o.stop(t+.5);}
function clink(t){var c=ac();if(!c)return;t=t||c.currentTime;
  var b=c.createBuffer(1,c.sampleRate*.05,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  var s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=b;bp.type="bandpass";bp.frequency.value=4200;bp.Q.value=3;g.gain.value=.35;s.connect(bp);bp.connect(g);g.connect(MAS);s.start(t);
  bell(2350,t,.05,.35);bell(3170,t+.01,.03,.3);}
function thump(t){var c=ac();if(!c)return;t=t||c.currentTime;var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(70,t+.12);
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(MAS);o.start(t);o.stop(t+.2);}
var PENT=[0,2,4,7,9];
function note(i,base){var o=Math.floor(i/5);return (base||523.25)*Math.pow(2,(o*12+PENT[i%5])/12);}
function arp(base,steps,gap,v){var c=ac();if(!c)return;var t=c.currentTime;steps.forEach(function(s,i){bell(base*Math.pow(2,s/12),t+i*gap,v||.12,1.4);});}
function pad(freqs,dur,v){var c=ac();if(!c)return;var t=c.currentTime;freqs.forEach(function(f){[-5,5].forEach(function(ct){var o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type="sawtooth";o.frequency.value=f*Math.pow(2,ct/1200);lp.type="lowpass";lp.frequency.value=f*5;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.03,t+.6);
  g.gain.setValueAtTime(v||.03,t+dur-.8);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(lp);lp.connect(g);g.connect(MAS);g.connect(DEL);o.start(t);o.stop(t+dur+.1);});});}
function splash(){var c=ac();if(!c)return;var t=c.currentTime,b=c.createBuffer(1,c.sampleRate*1.6,c.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  var s=c.createBufferSource(),lp=c.createBiquadFilter(),g=c.createGain();s.buffer=b;lp.type="lowpass";lp.frequency.setValueAtTime(5000,t);lp.frequency.exponentialRampToValueAtTime(400,t+1.5);g.gain.value=.5;
  s.connect(lp);lp.connect(g);g.connect(MAS);s.start(t);}
function horn(){var c=ac();if(!c)return;var t=c.currentTime;[220,277.18,329.63].forEach(function(f){var o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type="sawtooth";o.frequency.value=f;
  lp.type="lowpass";lp.frequency.value=1400;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.15);g.gain.setValueAtTime(.06,t+1.1);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
  o.connect(lp);lp.connect(g);g.connect(MAS);o.start(t);o.stop(t+1.6);});}
function fanfare(){arp(523.25,[0,4,7,12,16,19,24],.09,.13);setTimeout(function(){pad([523.25,659.25,783.99,1046.5],3,.025);},600);}
function feel(k){try{if(window.VV_TAPTIC)VV_TAPTIC(k);}catch(e){}}

/* ---------------- native: island (iPhone), notifications ---------------- */
function plug(name){try{var C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return null;
  if(C.Plugins&&C.Plugins[name])return C.Plugins[name];if(C.registerPlugin)return C.registerPlugin(name);}catch(e){}return null;}
var lastIsland=0,islandTimer=null;
function island(action,force){
  var P=plug("Purr");if(!P||!P.island)return;
  var now=Date.now();
  if(!force&&action!=="end"&&now-lastIsland<1500){clearTimeout(islandTimer);islandTimer=setTimeout(function(){island(action,true);},1600);return;}
  lastIsland=now;
  var st=STAGES[Math.min(S.stage,9)],until=S.dryUntil>now?S.dryUntil:0;
  var label=action==="end"?T().onWater:(until?fmt(T().drying,{t:""}).replace(/[\s·]+$/,""):T().st[st][0]);
  try{P.island({action:action,ship:S.name||T().title,stage:label,pct:pct(),icon:action==="end"?"🚢":until?"🎨":"⚓",until:until}).catch(function(){});}catch(e){}
}
var LNP=null;function notif(){if(LNP!==null)return LNP;LNP=plug("LocalNotifications")||false;return LNP;}
var ANDROID=/Android/i.test(navigator.userAgent);
function ongoing(){   /* Android has no island: a quiet progress notification instead */
  var L=notif();if(!L||!ANDROID||!S.notifOk)return;
  try{L.schedule({notifications:[{id:7700,title:T().title+" · "+pct()+"%",body:T().st[STAGES[Math.min(S.stage,9)]][0],ongoing:true,autoCancel:false,silent:true}]}).catch(function(){});}catch(e){}
}
function askNotif(){var L=notif();if(!L)return Promise.resolve(false);
  return L.requestPermissions().then(function(r){S.notifOk=r.display==="granted";save();return S.notifOk;}).catch(function(){return false;});}
function planDry(){var L=notif();if(!L)return;
  askNotif().then(function(ok){if(!ok)return;
    L.schedule({notifications:[{id:7701,title:T().notifT,body:T().notifB,schedule:{at:new Date(S.dryUntil)}}]}).catch(function(){});ongoing();});}

/* ---------------- geometry: the ship, piece by piece ---------------- */
var EL=[];   /* {stage, polys:[{p:[[x,y,z]], c, w(line width), role}], t0} */
function hw(x){var u=(x+5)/10;if(u<.12)return 1.25*(.78+.22*u/.12);if(u>.58){var q=(u-.58)/.42;return 1.25*Math.sqrt(Math.max(0,1-q*q*q*.98))*(1-q*.15);}return 1.25;}
function dk(x){var u=(x+5)/10;return 1.5+.38*u*u*u;}
var SEC=[[0,0],[.55,.08],[.88,.32],[1,.72],[1,1]];   /* half-section: z factor, y fraction of the deck height */
function P(x,k,sd){return [x,SEC[k][1]*dk(x),sd*SEC[k][0]*hw(x)];}
var NST=11,XS=[];for(var i=0;i<NST;i++)XS.push(-5+i);
function box(x0,x1,y0,y1,z0,z1,c,role){return [
  {p:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],c:c,role:role,cull:1},{p:[[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]],c:c,role:role,cull:1},
  {p:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]].reverse(),c:c,role:role,cull:1},{p:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],c:c,role:role,cull:1},
  {p:[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],c:c,role:role,cull:1},{p:[[x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1]],c:c,role:role,cull:1}];}
function cyl(x,z,y0,y1,r,c,n){var a=[];n=n||10;for(var i=0;i<n;i++){var a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;
  a.push({p:[[x+Math.cos(a0)*r,y0,z+Math.sin(a0)*r],[x+Math.cos(a1)*r,y0,z+Math.sin(a1)*r],[x+Math.cos(a1)*r,y1,z+Math.sin(a1)*r],[x+Math.cos(a0)*r,y1,z+Math.sin(a0)*r]],c:c,cull:1,flip:1});}
  var top=[];for(i=0;i<n;i++){var aa=i/n*Math.PI*2;top.push([x+Math.cos(aa)*r,y1,z+Math.sin(aa)*r]);}a.push({p:top.reverse(),c:c,cull:1});return a;}
function add(stage,polys){EL.push({stage:stage,polys:polys,t0:null});}
(function build(){
  /* keel: six lengths of steel along the bottom */
  for(var i=0;i<6;i++){var x0=-5.2+i*10.6/6,x1=x0+10.6/6+.01;add("keel",box(x0,x1,-.18,.02,-.12,.12,"#5c6a76"));}
  /* frames: a rib at each station, with a beam across the top */
  XS.forEach(function(x){var pts=[];for(var k=4;k>=0;k--)pts.push(P(x,k,-1));for(k=1;k<=4;k++)pts.push(P(x,k,1));
    add("frames",[{p:pts,c:"#ff8a3d",w:3.2,line:1},{p:[P(x,4,-1),P(x,4,1)],c:"#ff8a3d",w:2.2,line:1}]);});
  /* engine: block, cylinders, a flywheel, a boiler */
  add("engine",box(-2.6,-.6,.15,.7,-.55,.55,"#3e7fb8"));
  add("engine",box(-2.4,-1.9,.7,1.15,-.25,.25,"#4f95cf"));
  add("engine",box(-1.8,-1.3,.7,1.15,-.25,.25,"#4f95cf"));
  add("engine",box(-1.2,-.7,.7,1.15,-.25,.25,"#4f95cf"));
  add("engine",cyl(-3.3,0,.15,1.05,.42,"#e2553f",10));
  add("engine",cyl(-.35,.62,.3,.75,.25,"#ffc43d",8));
  /* plating: one segment per tap — four strakes on each side; the transom comes with the first */
  for(var s=0;s<10;s++){var a=XS[s],b=XS[s+1],ps=[];
    for(var k=0;k<4;k++)[-1,1].forEach(function(sd){ps.push({p:[P(a,k,sd),P(b,k,sd),P(b,k+1,sd),P(a,k+1,sd)],c:STEEL,role:"hull",k:k,x:(a+b)/2});});
    if(s===0){var tr=[];for(k=4;k>=0;k--)tr.push(P(-5,k,-1));for(k=1;k<=4;k++)tr.push(P(-5,k,1));ps.push({p:tr,c:STEEL,role:"hull",k:3,x:-5});}
    add("plating",ps);}
  /* deck: five strips of planks */
  for(s=0;s<5;s++){var d0=XS[s*2],d1=XS[s*2+2],dp=[];
    for(var j=0;j<2;j++){var xa=d0+j,xb=xa+1;dp.push({p:[[xa,dk(xa)+.001,-hw(xa)],[xb,dk(xb)+.001,-hw(xb)],[xb,dk(xb)+.001,hw(xb)],[xa,dk(xa)+.001,hw(xa)]],c:"#e0b075",role:"deck"});
      dp.push({p:[[xa,dk(xa)+.12,hw(xa)],[xb,dk(xb)+.12,hw(xb)],[xb,dk(xb),hw(xb)],[xa,dk(xa),hw(xa)]],c:"#f4f1ea",role:"rail"});
      dp.push({p:[[xa,dk(xa)+.12,-hw(xa)],[xb,dk(xb)+.12,-hw(xb)],[xb,dk(xb),-hw(xb)],[xa,dk(xa),-hw(xa)]],c:"#f4f1ea",role:"rail"});}
    add("deck",dp);}
  /* propeller and rudder */
  add("prop",[{p:[[-5.9,.42,0],[-4.6,.42,0]],c:"#59646e",w:4,line:1}]);
  add("prop",cyl(-5.9,0,.32,.52,.1,"#d9a441",6).map(function(q){q.p=q.p.map(function(v){return [v[0],v[1],v[2]];});return q;}));
  [0,1,2,3].forEach(function(b){add("prop",[{p:[[-5.95,.42,0],[-5.95,.42+Math.cos(b*Math.PI/2)*.55,Math.sin(b*Math.PI/2)*.55],[-5.95,.42+Math.cos(b*Math.PI/2+.5)*.5,Math.sin(b*Math.PI/2+.5)*.5]],c:"#e8b84e",role:"blade",b:b}]);});
  add("prop",[{p:[[-6.35,.05,0],[-6.0,.05,0],[-6.0,1.2,0],[-6.35,1.0,0]],c:"#e2553f",role:"rudder"}]);
  /* bridge: superstructure in tiers, windows */
  add("bridge",box(-2.4,.4,dk(-1)+0,dk(-1)+.7,-.85,.85,"#f4f1ea"));
  add("bridge",box(-2.0,0,dk(-1)+.7,dk(-1)+1.3,-.7,.7,"#f4f1ea"));
  add("bridge",[{p:[[.01,dk(-1)+.9,-.6],[.01,dk(-1)+.9,.6],[.01,dk(-1)+1.15,.6],[.01,dk(-1)+1.15,-.6]],c:"#2a5d8f"},{p:[[-2,dk(-1)+.92,.71],[-.1,dk(-1)+.92,.71],[-.1,dk(-1)+1.12,.71],[-2,dk(-1)+1.12,.71]],c:"#2a5d8f"},{p:[[-.1,dk(-1)+.92,-.71],[-2,dk(-1)+.92,-.71],[-2,dk(-1)+1.12,-.71],[-.1,dk(-1)+1.12,-.71]],c:"#2a5d8f"}].concat(box(-1.6,-.4,dk(-1)+1.3,dk(-1)+1.4,-.75,.75,"#ffc43d")));
  add("bridge",[{p:[[3.5,dk(3.5),0],[3.5,dk(3.5)+2.3,0]],c:"#5c6a76",w:3,line:1},{p:[[3.5,dk(3.5)+1.8,-.5],[3.5,dk(3.5)+1.8,.5]],c:"#5c6a76",w:2,line:1}]);

  g.fillStyle="#2b1708";g.beginPath();g.arc(cxm-22*s,cym-165*s,4*s,0,7);g.arc(cxm+12*s,cym-165*s,4*s,0,7);g.fill();
  g.strokeStyle="#7a3d22";g.lineWidth=3*s;g.beginPath();g.arc(cxm-6*s,cym-140*s,14*s,.3,2.8);g.stroke();   /* a kind smile */
  /* the plate, held out into the light */
  var px=cxm-95*s,py=cym+40*s;
  g.fillStyle="#7a6a58";g.beginPath();g.ellipse(px,py+8*s,118*s,34*s,0,0,7);g.fill();
  g.fillStyle=lit(px-110*s,0,px+110*s,0,"#fffaf0","#9c8f7c");g.beginPath();g.ellipse(px,py,115*s,32*s,0,0,7);g.fill();
  g.fillStyle=lit(px-100*s,0,px+100*s,0,"#fff3d2","#b89a6c");
  var left=5-eatN;for(var i=0;i<left;i++){var vx=px-70*s+i*35*s,vy=py-4*s+(i%2)*6*s;g.beginPath();g.arc(vx,vy,20*s,Math.PI,0);g.closePath();g.fill();
    g.strokeStyle="#c9a56a";g.lineWidth=1.5*s;g.beginPath();g.arc(vx,vy,18*s,Math.PI+.2,-.2);g.stroke();}
  if(left>0){g.fillStyle="#fffdf6";g.beginPath();g.ellipse(px+60*s,py-14*s,20*s,11*s,0,0,7);g.fill();g.beginPath();g.arc(px+60*s,py-24*s,9*s,0,7);g.fill();}
  /* steam */
  g.strokeStyle="rgba(255,246,226,.45)";g.lineWidth=4*s;for(var k=0;k<3;k++){g.beginPath();for(var y=0;y<90;y+=6){var xx=px-40*s+k*40*s+Math.sin(t*2+y/12+k)*8*s;y?g.lineTo(xx,py-20*s-y*s):g.moveTo(xx,py-20*s-y*s);}g.stroke();}
  g.restore();
  requestAnimationFrame(carLoop);
}

/* ---------------- input: drag to turn, tap to build ---------------- */
var down=null;
cv.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY,yaw:cam.yaw,m:0};lastInput=performance.now();try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener("pointermove",function(e){if(!down)return;var dx=e.clientX-down.x;down.m=Math.max(down.m,Math.abs(dx)+Math.abs(e.clientY-down.y));cam.yaw=down.yaw-dx*.008;lastInput=performance.now();});
cv.addEventListener("pointerup",function(e){if(down&&down.m<10){var r=cv.getBoundingClientRect();doTap(e.clientX-r.left,e.clientY-r.top);}down=null;});
act.addEventListener("click",function(){doTap(null,null);});
side.addEventListener("click",tea);

/* ---------------- loop ---------------- */
var last=performance.now();
function loop(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!down&&now-lastInput>2500)cam.yaw+=dt*.12;
  if(STAGES[S.stage]==="prop"||S.stage>5)propSpin+=dt*(launchT0?14:3);
  if(S.stage>7||(S.stage===7&&S.n>=3)){if(Math.random()<dt*5)smoke.push({x:-3+(Math.random()-.5)*.2,y:dk(-1)+2.5,z:(Math.random()-.5)*.2,r:.18,a:.8});}
  smoke=smoke.filter(function(s){s.y+=dt*.9;s.x-=dt*.5;s.r+=dt*.22;s.a-=dt*.22;return s.a>0;});
  if(launchT0){var lt=(now-launchT0)/1000;
    if(lt>1.2){var u=Math.min(1,(lt-1.2)/3.2),e=u*u*(3-2*u);ship.x=-16*e;ship.y=-.39*Math.min(1,e*1.5)-.9*Math.max(0,(e-.55)/.45);ship.rock=Math.min(1,e*2);
      if(!launchT0.sp&&e>.6){launchT0={valueOf:function(){return this.t;},t:launchT0,sp:1};splash();feel("heavy");var p=proj(view([-9.5+ship.x*.0,-.6,0]));sparks(p[0],p[1],60,["#ffffff","#bfefff","#4fc3e8"]);}
      if(u>=1&&!S.done)finish();}
    cam.tx+=((ship.x-.5)-cam.tx)*Math.min(1,dt*2);}
  else if(S.done){ship.x=-16;ship.y=-1.29;ship.rock=1;cam.tx+=((ship.x-.5)-cam.tx)*Math.min(1,dt*2);}
  cam.dist=W<500?14.5:13;
  if(W)draw(now);fx();
  if(STAGES[S.stage]==="paint"&&S.dryUntil){if(Math.floor(now/500)!==loop.h){loop.h=Math.floor(now/500);hud();dryCheck();}}
  requestAnimationFrame(loop);
}

/* ---------------- start ---------------- */
function card(html){$("card").innerHTML=html;$("ov").style.display="flex";dirs();}
function intro(){
  card('<div class="big">⚓🚢🔨</div><h1>'+esc(T().title)+'</h1><p>'+esc(T().intro)+'</p><button class="go" id="go">'+esc(T().start)+'</button><div class="lang">'+
    LANGS.map(function(l){return '<button data-l="'+l+'" aria-pressed="'+(l===LN)+'">'+{uk:"УКР",en:"EN",nl:"NL",ru:"РУС",ar:"عربي",zh:"中文"}[l]+'</button>';}).join("")+'</div>');
  [].forEach.call(document.querySelectorAll("#ov .lang button"),function(b){b.onclick=function(){LN=b.dataset.l;try{localStorage.setItem("lang",LN);}catch(e){}feel("tick");intro();hud();if(STAGES[S.stage]==="paint")paintCols();};});
  $("go").onclick=function(){wake();feel("success");arp(523.25,[0,4,7,12],.07,.11);$("ov").style.display="none";stageStart();};
}
resize();restore();if(STAGES[S.stage]==="paint")paintCols();if(S.painted)paintT0=0;
if(S.done){ship.x=-16;cam.tx=-16.5;}
hud();dirs();
if(S.done){finish();}else intro();
document.addEventListener("visibilitychange",function(){if(!document.hidden){dryCheck();hud();}});
requestAnimationFrame(loop);
window.VV_KORABEL={busy:function(){return busy||carOn;},state:function(){return S;},tap:doTap,caravaggio:caravaggio,pct:pct};
})();
