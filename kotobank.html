*{box-sizing:border-box}

a{color:inherit}

.logo{font:800 22px -apple-system,Inter,system-ui;letter-spacing:-.5px}.logo span{color:var(--acc)}
.langs{margin-left:auto;display:flex;gap:4px}.langs button{border:0;background:var(--card);color:var(--dim);border-radius:10px;padding:5px 7px;font:700 11px system-ui;cursor:pointer}

.cardx{position:relative;border-radius:26px;padding:20px;min-height:200px;overflow:hidden;background:linear-gradient(135deg,#ff5f6d 0%,#ffc371 48%,#7b5cff 100%);color:#140b12;box-shadow:0 18px 50px #ff5f6d33}
.cardx::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:#ffffff26}
.cardx .nm{font:800 14px system-ui;opacity:.75;letter-spacing:.3px}
.cardx .bal{font:800 46px/1.05 -apple-system,Inter,system-ui;letter-spacing:-1.5px;margin:18px 0 4px;font-variant-numeric:tabular-nums}

.cardx .num{position:absolute;left:20px;bottom:18px;font:700 15px ui-monospace,Menlo,monospace;letter-spacing:2px}
.cardx .paw{position:absolute;right:18px;bottom:12px;font-size:40px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.acts button{border:0;background:var(--card);color:var(--tx);border-radius:18px;padding:12px 4px 10px;font:700 11px system-ui;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.acts button b{font-size:22px;width:44px;height:44px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center}
.acts button:active{transform:scale(.96)}
h2{font:800 19px -apple-system,Inter,system-ui;margin:22px 4px 10px;letter-spacing:-.3px}
.box{background:var(--card);border-radius:22px;padding:6px 14px}

.row .ic{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--dim);font-size:12px}
.row .a{font:750 15px system-ui;font-variant-numeric:tabular-nums}.row .a.p{color:var(--ok)}
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jar{background:var(--card);border-radius:20px;padding:12px;cursor:pointer;border:0;color:var(--tx);text-align:left;font:inherit}
.jar .e{font-size:26px}.jar b{display:block;font-size:13px;margin:6px 0 2px}.jar small{color:var(--dim);font-size:11px}
.jar .bar{height:6px;border-radius:9px;background:var(--card2);margin-top:8px;overflow:hidden}.jar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:9px}
.tr{background:linear-gradient(160deg,#20202a,#1b1b1f);border-radius:22px;padding:16px}
.tr p{margin:0 0 10px;color:var(--dim);font-size:13px}
.tr .src{background:var(--card2);border-radius:14px;padding:12px;font-weight:650;margin-bottom:10px}
.tr input,.tr textarea{width:100%;background:#0e0e11;border:1px solid #ffffff1c;color:var(--tx);border-radius:14px;padding:11px 12px;font:500 15px system-ui;margin-bottom:8px}
.tr textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:16px;padding:13px 16px;font:800 15px system-ui;cursor:pointer;background:var(--tx);color:var(--bg);width:100%}
.btn.alt{background:var(--card2);color:var(--tx)}
.chain{font:500 11px/1.45 ui-monospace,Menlo,monospace;color:var(--dim)}
.chain .blk{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px;word-break:break-all}
.chain .blk b{color:var(--tx)}
.note{color:var(--dim);font-size:12px;text-align:center;margin:18px 8px}
.kurtka-stage{margin-top:8px}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet .in{background:#17171b;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
#sheet h3{margin:0 0 8px;font:800 22px system-ui}#sheet p{color:var(--dim);margin:0 0 14px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-120%);background:#fff;color:#111;border-radius:16px;padding:10px 16px;font:800 14px system-ui;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s;opacity:0;z-index:30;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
[dir=rtl] .row .a{direction:ltr}

  $("cardName").textContent=X.name;$("cur").textContent=X.cur;$("bal").textContent=fmtN(K.balance());
  [["aEarn","earn"],["aPet","pet"],["aOut","out"],["aKurt","kurt"]].forEach(function(p){$(p[0]).querySelector("span").textContent=X[p[1]];});
  $("hJars").textContent=X.jars;$("hTr").textContent=X.tr;$("trP").textContent=X.trP;$("trSrc").textContent=X.phrases[phraseI];
  $("trLang").placeholder=X.trLang;$("trTxt").placeholder=X.trTxt;$("trGo").textContent=X.trGo;$("trNote").textContent=X.trNote;
  $("hFeed").textContent=X.feed;$("hChain").textContent=X.chain;$("verify").textContent=X.verify;$("disc").textContent=X.disc;$("jarLink").textContent=X.jar;
  var jv=jarLoad();$("jars").innerHTML="";JARS.forEach(function(j,i){var b=document.createElement("button");b.className="jar";
    b.innerHTML='<div class="e">'+j.e+'</div><b></b><small></small><div class="bar"><i style="width:'+Math.min(100,jv[i]/j.goal*100)+'%"></i></div>';
    b.querySelector("b").textContent=X.jarNames[i];b.querySelector("small").textContent=fmtN(jv[i])+" / "+fmtN(j.goal)+" · "+X.put;
    b.onclick=function(){K.spend(10,"🏺 "+X.jarNames[i]).then(function(r){if(!r){toast(X.noMoney);VV_TAPTIC&&VV_TAPTIC("warning");return;}var v=jarLoad();v[i]+=10;jarSave(v);if(v[i]>=j.goal&&v[i]-10<j.goal){VV_TAPTIC&&VV_TAPTIC("success");toast("🎉 "+X.jarNames[i]);}render();});};
    $("jars").appendChild(b);});
  var c=K.chain().slice().reverse(),f=$("feed");f.innerHTML="";
  if(c.length<2){f.innerHTML='<div class="row"><div class="ic">🐈</div><div class="t"><small></small></div></div>';f.querySelector("small").textContent=X.empty;}
  c.filter(function(b){return b.i>0;}).slice(0,30).forEach(function(b){var r=document.createElement("div");r.className="row";
    var ic=b.a>0?(/перекл|transl|vertal|перев|ترجم|翻译/i.test(b.r)?"🌍":/корабель|ship|schip|корабль|سفينة|船/i.test(b.r)?"🚢":"🐟"):(/🏺/.test(b.r)?"🏺":"🫳");
    r.innerHTML='<div class="ic">'+ic+'</div><div class="t"><b></b><small></small></div><div class="a'+(b.a>0?' p':'')+'"></div>';
    r.querySelector("b").textContent=b.r;r.querySelector("small").textContent=new Date(b.t).toLocaleString(LN==="ar"?"ar":LN==="zh"?"zh-CN":LN,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    r.querySelector(".a").textContent=(b.a>0?"+":"−")+fmtN(Math.abs(b.a))+" 🐾";f.appendChild(r);});
  var ch=$("chain");ch.innerHTML="";K.chain().slice(-6).reverse().forEach(function(b){var d=document.createElement("div");d.className="blk";
    d.innerHTML="<b>#"+b.i+"</b> · "+(b.a>=0?"+":"")+b.a+" 🐾<br>hash "+String(b.h).slice(0,32)+"…<br>prev "+String(b.p).slice(0,32)+"…";ch.appendChild(d);});
  $("langs").innerHTML="";["uk","en","nl","ru","ar","zh"].forEach(function(l){var b=document.createElement("button");b.textContent={uk:"УК",en:"EN",nl:"NL",ru:"РУ",ar:"ع",zh:"中"}[l];
    b.setAttribute("aria-pressed",l===LN);b.onclick=function(){LN=l;try{localStorage.setItem("lang",l);}catch(e){}VV_TAPTIC&&VV_TAPTIC("tick");render();};$("langs").appendChild(b);});
}
var lastFish=0;
$("aEarn").onclick=function(){var n=Date.now();if(n-lastFish<1500){VV_TAPTIC&&VV_TAPTIC("tick");return;}lastFish=n;K.earn(1,T().fish);};
$("aPet").onclick=function(){K.spend(1,T().petR).then(function(r){if(!r){toast(T().noMoney);return;}VV_TAPTIC&&VV_TAPTIC("soft");toast("😽 purr…");});};
$("aOut").onclick=function(){VV_TAPTIC&&VV_TAPTIC("click");sheet(T().outT,T().outP);};
$("aKurt").onclick=function(){var b=$("kurtBox");VV_TAPTIC&&VV_TAPTIC("click");
  if(!b.firstChild){var h=document.createElement("h2");h.textContent=T().kurtT;b.appendChild(h);var s=document.createElement("div");s.className="kurtka-stage";b.appendChild(s);if(window.VV_KURTKA)VV_KURTKA(s);}
  b.scrollIntoView({behavior:"smooth",block:"start"});};
$("verify").onclick=function(){K.verify().then(function(ok){VV_TAPTIC&&VV_TAPTIC(ok?"success":"error");toast(ok?T().ok.replace("{n}",K.chain().length):T().bad);});};
$("trGo").onclick=function(){
  var lang=$("trLang").value.trim(),txt=$("trTxt").value.trim();if(!lang||!txt){$((lang?"trTxt":"trLang")).focus();VV_TAPTIC&&VV_TAPTIC("warning");return;}
  var src=T().phrases[phraseI],ua=TX.uk.phrases[phraseI];
  var url="https://github.com/rxvkbr/minvaibvet/issues/new?labels=translation&title="+encodeURIComponent("Переклад · "+lang)+
    "&body="+encodeURIComponent("**Мова:** "+lang+"\n\n**Оригінал:** "+ua+"\n\n**Переклад:** "+txt+"\n\n_Надіслано з Котобанку_ 🐾");
  window.open(url,"_blank","noopener");
  K.earn(20,"🌍 "+lang+": "+txt.slice(0,40)).then(function(){toast(T().trThanks);});
  $("trTxt").value="";phraseI=(phraseI+1)%5;render();
};
window.addEventListener("kotobank",render);
render();K.daily();
})();
</script>
</body>
</html>
