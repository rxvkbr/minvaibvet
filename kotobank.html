var MON0=Date.UTC(1970,0,5);function weekNo(t){var d=new Date(t);d.setUTCHours(0,0,0,0);var day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return Math.round((d.getTime()-MON0)/6048e5);}
