  else{scale=Math.min(r.width/VW,r.height/VH);ox=(r.width-VW*scale)/2;oy=(r.height-VH*scale)/2;}}

var SEG=[],PLEN=0;for(var i=1;i<PATH.length;i++){var a=PATH[i-1],b=PATH[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);SEG.push({a:a,b:b,l:l,s:PLEN});PLEN+=l;}

    S.skels.forEach(function(s){s.t-=dt;});S.skels=S.skels.filter(function(s){return s.t>0;});
    S.en.forEach(function(e){
      e.slow=1;S.tw.forEach(function(t){if(t.k==="cat"){var q=at(e.d),r=TOWERS.cat.range+(t.lv-1)*15;if(Math.hypot(q[0]-t.pad.x,q[1]-t.pad.y)<r)e.slow=Math.min(e.slow,1-(.35+t.lv*.1));}});
      var blocked=S.skels.some(function(s){return e.d<s.d&&e.d>s.d-18&&!ENEMY[e.k].boss;});
      if(!blocked)e.d+=e.sp*e.slow*dt;
      if(e.d>=PLEN&&!e.dead){e.dead=1;S.hp-=ENEMY[e.k].w;hud();sfx(150,.3,.12,"square",.5);window.VV_TAPTIC?VV_TAPTIC("error"):buzz(25);if(S.hp<=0)end(false);}
    });
    S.tw.forEach(function(t){var d=TOWERS[t.k];if(!d.rate)return;t.cd-=dt;if(t.cd>0)return;
      var r=d.range+(t.lv-1)*15,best=null;S.en.forEach(function(e){if(e.dead)return;var q=at(e.d);if(Math.hypot(q[0]-t.pad.x,q[1]-t.pad.y)<r&&(!best||e.d>best.d))best=e;});
      if(!best)return;t.cd=d.rate/(1+(t.lv-1)*.25);var dmg=d.dmg*(1+(t.lv-1)*.6);
      if(d.aoe){S.fx.push({k:"steam",x:t.pad.x,y:t.pad.y,r:r,t:0});S.en.forEach(function(e){var q=at(e.d);if(!e.dead&&Math.hypot(q[0]-t.pad.x,q[1]-t.pad.y)<r)hit(e,dmg);});sfx(1400,.12,.012,"sine",.6);}
      else{var q=at(best.d);S.fx.push({k:"beam",x:t.pad.x,y:t.pad.y-22,x2:q[0],y2:q[1],t:0});hit(best,dmg);sfx(880,.06,.015,"triangle",1.4);}});
    S.en=S.en.filter(function(e){return !e.dead;});
    if(S.run&&!S.spawn.length&&!S.en.length&&S.hp>0){S.run=false;var bonus=20+S.wave*5;S.gold+=bonus;hud();
      if(S.wave>=WAVES.length)end(true);else{toast(W.cleared+" ✨"+bonus);L&&L.level();window.VV_TAPTIC?VV_TAPTIC("success"):buzz(20);say(S.wave%2?"nekromant":"moriak","select");}}
  }
  S.fx.forEach(function(f){f.t+=dt;});S.fx=S.fx.filter(function(f){return f.t<(f.k==="storm"?1:f.k==="pop"?.8:f.k==="seal"?.6:.25);});
}

/* ============ drawing ============ */
function draw(T){
  c.restore();c.save();
  c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle="#120c10";c.fillRect(0,0,cv.width,cv.height);
  if(ROT)c.setTransform(0,DPR*scale,-DPR*scale,0,DPR*(ox+VH*scale),DPR*oy);else c.setTransform(DPR*scale,0,0,DPR*scale,DPR*ox,DPR*oy);
  c.beginPath();c.rect(0,0,VW,VH);c.clip();
  var g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,"#26331f");g.addColorStop(1,"#1a2417");c.fillStyle=g;c.fillRect(0,0,VW,VH);
  /* canal at the bottom */
  c.fillStyle="#1d3a4a";c.fillRect(0,480,VW,60);c.strokeStyle="#4f7f93";c.lineWidth=1.5;for(var i=0;i<8;i++){c.beginPath();for(var x=0;x<=VW;x+=20)c.lineTo(x,495+i*6+Math.sin(x/40+T*1.5+i)*2);c.stroke();}
  /* path */
  c.lineCap="round";c.lineJoin="round";c.strokeStyle="#5b4a33";c.lineWidth=46;c.beginPath();PATH.forEach(function(p,i){i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);});c.stroke();
  c.strokeStyle="#76603f";c.lineWidth=36;c.stroke();c.setLineDash([2,14]);c.strokeStyle="#8f7650";c.lineWidth=3;c.stroke();c.setLineDash([]);
  /* gates of the public office */
  c.fillStyle="#3a3f4a";c.fillRect(905,62,50,110);c.fillStyle="#262a32";c.fillRect(915,95,30,77);c.fillStyle="#cdd6e0";c.font="bold 11px system-ui";c.textAlign="center";c.fillText("ЦНАП",930,82);
  /* home */
  c.fillStyle="#3b2a22";c.beginPath();c.moveTo(20,470);c.lineTo(20,415);c.lineTo(60,385);c.lineTo(100,415);c.lineTo(100,470);c.fill();
  var glow=c.createRadialGradient(60,435,2,60,435,40);glow.addColorStop(0,"rgba(255,200,110,.6)");glow.addColorStop(1,"rgba(255,200,110,0)");c.fillStyle=glow;c.fillRect(10,395,100,80);
  c.fillStyle="#ffcf73";c.fillRect(50,425,20,16);c.fillStyle="#3b2a22";c.fillRect(59,425,2,16);c.fillRect(50,432,20,2);
  /* pads and towers */
  PADS.forEach(function(p){
    if(!p.t){c.strokeStyle="#e8d6a855";c.lineWidth=2;c.setLineDash([5,5]);c.beginPath();c.arc(p.x,p.y,22,0,7);c.stroke();c.setLineDash([]);c.fillStyle="#e8d6a833";c.font="16px system-ui";c.fillText("+",p.x,p.y+6);return;}
    var t=p.t,d=TOWERS[t.k];c.fillStyle="#00000055";c.beginPath();c.ellipse(p.x,p.y+16,22,7,0,0,7);c.fill();
    c.font="34px system-ui";c.textAlign="center";c.fillText(d.ic,p.x,p.y+12);
    for(var s=0;s<t.lv;s++){c.fillStyle="#ffe08a";c.beginPath();c.arc(p.x-8+s*8,p.y+26,2.6,0,7);c.fill();}
    if(t.k==="lh"){c.fillStyle="rgba(255,224,138,"+(.12+.08*Math.sin(T*3))+")";c.beginPath();c.moveTo(p.x,p.y-22);c.arc(p.x,p.y-22,60,T%6.28,T%6.28+.5);c.fill();}
  });
  /* skeleton blockers */
  S.skels.forEach(function(s){var q=at(s.d);c.font="28px system-ui";c.fillText("💀",q[0],q[1]+8);c.fillStyle="#fff";c.font="bold 10px system-ui";c.fillText(Math.ceil(s.t)+"с",q[0],q[1]-16);});
  /* enemies */
  S.en.forEach(function(e){var q=at(e.d),E=ENEMY[e.k],y=q[1]+Math.sin(T*8+e.bob)*2;
    if(E.boss){c.fillStyle="#5a3e2a";c.fillRect(q[0]-34,y-14,68,26);c.font="22px system-ui";c.fillText("🧐🧐🧐",q[0],y-18);}
    else if(e.k==="q"){for(var j=0;j<3;j++){c.fillStyle=E.col;c.beginPath();c.arc(q[0]+j*9-9,y-14,6,0,7);c.fill();c.fillRect(q[0]+j*9-14,y-8,10,16);}}
    else{c.save();c.translate(q[0],y);c.rotate(Math.sin(T*4+e.bob)*.12);c.fillStyle=E.col;c.fillRect(-11,-15,22,28);c.fillStyle="#555";c.fillRect(-7,-9,14,2);c.fillRect(-7,-4,14,2);c.fillRect(-7,1,10,2);
      if(e.k==="r"){c.strokeStyle="#d33";c.lineWidth=2;c.beginPath();c.arc(4,7,5,0,7);c.stroke();}
      c.fillStyle="#222";c.beginPath();c.arc(-4,-12,1.8,0,7);c.arc(4,-12,1.8,0,7);c.fill();c.restore();}
    if(e.slow<1){c.font="10px system-ui";c.fillText("🐾",q[0]+14,y-16);}
    var w=E.boss?70:26;c.fillStyle="#0009";c.fillRect(q[0]-w/2,y-(E.boss?44:26),w,4);c.fillStyle=e.hp/e.max>.4?"#7be07b":"#ff7a5a";c.fillRect(q[0]-w/2,y-(E.boss?44:26),w*Math.max(0,e.hp/e.max),4);});
  /* effects */
  S.fx.forEach(function(f){var k=f.t;
    if(f.k==="beam"){c.strokeStyle="rgba(255,236,150,"+(1-k*4)+")";c.lineWidth=4;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x2,f.y2);c.stroke();}
    if(f.k==="steam"){c.fillStyle="rgba(220,240,255,"+(.35-k*1.2)+")";c.beginPath();c.arc(f.x,f.y,f.r*(.5+k*2),0,7);c.fill();}
    if(f.k==="seal"){c.strokeStyle="rgba(190,120,255,"+(1-k/.6)+")";c.lineWidth=6;c.beginPath();c.arc(f.x,f.y,85*(.4+k),0,7);c.stroke();c.font="40px system-ui";c.globalAlpha=1-k/.6;c.fillText("🔏",f.x,f.y+14);c.globalAlpha=1;}
    if(f.k==="storm"){c.fillStyle="rgba(80,150,200,"+(.35*(1-k))+")";c.fillRect(0,0,VW,VH);c.font="60px system-ui";c.fillText("🌊",VW/2+Math.sin(k*20)*30,VH/2);}
    if(f.k==="tea"){c.font="40px system-ui";c.globalAlpha=1-k*4;c.fillText("🫖❤️",60,370-k*80);c.globalAlpha=1;}
    if(f.k==="pop"){c.fillStyle="rgba(255,215,90,"+(1-k/.8)+")";c.font="bold 14px system-ui";c.fillText("+"+f.g+"✨",f.x,f.y-20-k*30);}
  });
  if(S.arm==="seal"){c.fillStyle="rgba(190,120,255,.12)";c.fillRect(0,0,VW,VH);}
}

/* ============ screens ============ */
function card(h){$("card").innerHTML=h;$("ov").style.display="flex";}
function intro(){
  var langs=[["uk","УКР"],["en","EN"],["nl","NL"],["ar","عربي"],["zh","中文"],["ru","РУС"]];
  card("<div style='font-size:42px'>💀⚓</div><h1>"+W.title+"</h1><p>"+W.intro+"</p><div class='lang'>"+langs.map(function(l){return "<button data-l='"+l[0]+"' aria-pressed='"+(LANG===l[0])+"'>"+l[1]+"</button>";}).join("")+"</div><button id='st'>"+W.start+"</button>");
  document.querySelectorAll("#card .lang button").forEach(function(b){b.onclick=function(){try{localStorage.setItem("lang",b.dataset.l);}catch(e){}location.reload();};});
  $("st").onclick=function(){ac();$("ov").style.display="none";say("nekromant","select");setTimeout(function(){say("moriak","select");},1900);};
}
function end(win){
  S.over=true;S.run=false;hud();var sec=Math.round((performance.now()-S.start)/1000),mm=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
  if(win){L&&L.level();setTimeout(function(){L&&L.level();},500);say("moriak","ack");buzz(40);}else{say("nekromant","annoyed");}
  card("<div style='font-size:42px'>"+(win?"🏖️":"📄📄📄")+"</div><h1>"+(win?W.won:W.lost)+"</h1><p>"+(win?W.wonp:W.lostp)+"</p><p>"+W.time+": "+mm+(win?" · "+W.stars+" "+Math.round(S.hp/20*100)+"%":"")+"</p><button id='ag'>"+W.again+"</button>");
  $("ag").onclick=function(){reset();$("ov").style.display="none";};
}
fit();reset();intro();requestAnimationFrame(step);
/* for automated balance tests */
window.__legion={S:function(){return S;},update:update,wave:startWave,cast:cast,build:function(i,k,lv){var pd=PADS[i];pd.t={k:k,lv:lv||1,cd:0,pad:pd};S.tw.push(pd.t);},pads:PADS,path:PLEN};
})();
</script>
