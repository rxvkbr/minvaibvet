  S.gifts.forEach(function(g){if(g.done)return;emo(g.e,g.x-cam,g.y,26);});
  var tilt=Math.max(-.35,Math.min(.35,S.vy/900));if(!S.done)drawPlane(px,S.y,tilt);else drawPlane(px+(S.x-LEN)*.0,Math.min(S.y,ground()-24),0);
  S.parts=S.parts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l-=.03;if(p.l<=0)return false;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3,0,7);cx.fill();cx.globalAlpha=1;return true;});
  if(S.done&&S.y<ground()-24)S.y+=dt*120;
  requestAnimationFrame(step);
}
function burst(x,y,c){for(var i=0;i<14;i++){var a=Math.random()*6.3,s=2+Math.random()*4;S.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c:i%2?c:"#fff"});}}
function hud(){$("nN").textContent=S.notes.filter(function(n){return n!==99;}).length;$("nB").textContent=S.bucks;}
/* ---- input ---- */
cv.addEventListener("pointerdown",function(){S.hold=true;ac();});
["pointerup","pointercancel","pointerleave"].forEach(function(n){cv.addEventListener(n,function(){S.hold=false;});});
addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){S.hold=true;e.preventDefault();}if(e.code==="KeyD"&&vet)dropGift();});
addEventListener("keyup",function(e){if(e.code==="Space"||e.code==="ArrowUp")S.hold=false;});
$("mic").onclick=function(){ac();if(mic){micStop();paint();return;}micStart().then(function(){paint();toast(T().micNote);}).catch(function(){toast(T().micErr);nativeMode("play");});};
function dropGift(){if(!S.run||S.done)return;var i=Math.floor(Math.random()*4);S.gifts.push({x:S.x+10,y:S.y+18,vy:0,e:["🫖","🩴","💐","🐟"][i],name:T().gifts[i]});feel("soft");bell(392,0,.06,.3);}
$("drop").onclick=dropGift;
function paint(){$("ttl").textContent=T().ttl;$("mic").textContent=mic?T().micOn:T().mic;$("mic").className=mic?"on":"";$("drop").textContent=T().drop;$("drop").style.display=vet?"block":"none";document.documentElement.lang=LN;}
/* ---- cards ---- */
function card(h){$("card").innerHTML=h;$("ov").style.display="flex";}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function intro(){
  var own=false;try{own=localStorage.getItem("polit-vet")==="1";}catch(e){}
  card('<div class="big">🐈✈️🎵</div><h1>'+esc(T().title)+'</h1><p>'+esc(T().intro)+'</p><small>'+esc(T().micNote)+'</small><button class="go" id="go">'+esc(T().fly)+'</button>'+
    '<p style="margin-top:14px"><b>'+esc(T().vet)+'</b><br><small>'+esc(T().vetT)+'</small><button class="alt" id="vetB">'+esc(own?(vet?"✓ "+T().vetHave:T().vetHave):T().vetBuy)+'</button></p>'+
    '<div class="lang">'+["uk","en","nl","de"].map(function(l){return '<button data-l="'+l+'" aria-pressed="'+(l===LN)+'">'+l.toUpperCase()+'</button>';}).join("")+'</div>');
  [].forEach.call(document.querySelectorAll(".lang button"),function(b){b.onclick=function(){LN=b.dataset.l;try{localStorage.setItem("lang",LN);}catch(e){}paint();intro();};});
  $("vetB").onclick=function(){
    if(own){vet=!vet;try{localStorage.setItem("polit-vet-on",vet?"1":"0");}catch(e){}feel("click");paint();intro();return;}
    var K=window.VV_KOTO;if(!K||K.balance()<100){toast(T().vetNo);feel("warning");return;}
    K.spend(100,"🎖 "+T().vet).then(function(r){if(!r){toast(T().vetNo);return;}try{localStorage.setItem("polit-vet","1");localStorage.setItem("polit-vet-on","1");}catch(e){}vet=true;feel("success");bell(1046.5,0,.1);paint();intro();});};
  $("go").onclick=function(){ac();$("ov").style.display="none";S=fresh();spawn();S.run=true;engine(true);hud();feel("rigid");bell(659.25,0,.1);};
}
function land(){
  engine(false);feel("success");var n=S.notes.filter(function(x){return x!==99;}).length;
  if(window.VV_KOTO)VV_KOTO.earn(10+S.bucks,"✈️ "+T().landT,true);
  setTimeout(function(){
    card('<div class="big">🛬🐈</div><h1>'+esc(T().landT)+'</h1><p>'+esc(fmt(T().landP,{n:n,b:10+S.bucks}))+'</p><button class="alt" id="pl">'+esc(T().play)+'</button><br><button class="go" id="ag">'+esc(T().again)+'</button><p><a href="index.html#more">←</a></p>');
    function play(){var c=ac();if(!c)return;var t=c.currentTime+.1;S.notes.forEach(function(x,i){if(x===99){setTimeout(giggle,i*220);}else bell(nf(x%10),t+i*.22,.12);});}
    $("pl").onclick=play;play();$("ag").onclick=function(){$("ov").style.display="none";S=fresh();spawn();S.run=true;engine(true);hud();};
  },1400);
}
S=fresh();spawn();paint();intro();requestAnimationFrame(step);
window.VV_POLIT={state:function(){return S;},drop:dropGift};
})();
</script>
</body>
