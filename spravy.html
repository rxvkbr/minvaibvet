      if(fk.length)fk.slice(0,6).forEach(function(code){var b=document.createElement("button");b.textContent="📻 "+csName(friends[code].cs||[0,0,0]);b.onclick=function(){radio(code,c.k!=null?c.k:8);b.disabled=true;b.textContent+=" ✓";};r.appendChild(b);});
      else{var a=document.createElement("button");a.textContent=X.openRacia;a.onclick=function(){location.href="racia.html";};r.appendChild(a);}
      d.appendChild(r);}
    li.appendChild(d);});
  var pr=$("presets");pr.innerHTML="";PRE.forEach(function(p){var b=document.createElement("button");b.textContent=p.e+" "+X.pre[p.k];b.onclick=function(){addChore({k:p.k});};pr.appendChild(b);});
  seg("rep",X.rep,"rep");seg("size",X.size,"sz");
  $("langs").innerHTML="";["uk","en","nl","de"].forEach(function(l){var b=document.createElement("button");b.textContent=l.toUpperCase();b.setAttribute("aria-pressed",l===LN);b.onclick=function(){LN=l;try{localStorage.setItem("lang",l);}catch(e){}render();};$("langs").appendChild(b);});
  remPaint();
}
var form={rep:0,sz:1};
function seg(id,labels,key){var s=$(id);s.innerHTML="";labels.forEach(function(t,i){var b=document.createElement("button");b.textContent=t;b.setAttribute("aria-pressed",form[key]===i);b.onclick=function(){form[key]=i;window.VV_TAPTIC&&VV_TAPTIC("tick");render();};s.appendChild(b);});}
function addChore(o){var c={id:D.nid++,rep:form.rep,sz:form.sz};if(o.k!=null)c.k=o.k;else{c.n=o.n;c.e="✨";}D.list.push(c);save();window.VV_TAPTIC&&VV_TAPTIC("light");chime(0);render();}
$("addBtn").onclick=function(){var n=$("name").value.trim();if(!n){$("name").focus();return;}addChore({n:n});$("name").value="";};
function complete(c,part,ev){
  if(doneToday(c))return;var td=today();c.last=td;c.lastT=Date.now();c.justDone=true;
  D.days[td]=(D.days[td]||0)+1;
  if(D.lastDay!==td){var y=new Date(Date.now()-864e5),yd=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();D.streak=D.lastDay===yd?(D.streak||0)+1:1;D.lastDay=td;}
  save();var amt=Math.max(1,Math.round(REW[c.sz]*part));if(K)K.earn(amt,"✅ "+T().reward+": "+label(c),true);
  var x=ev&&ev.clientX||innerWidth/2,y=ev&&ev.clientY||innerHeight/2;burst(x,y,part<1?24:46);chime(D.days[td]);
  window.VV_TAPTIC&&VV_TAPTIC("success");
  var L=D.list.filter(due);if(L.every(doneToday)){setTimeout(function(){burst(innerWidth/2,innerHeight/3,120);chime(8);toast(T().allDone);},500);}
  else toast(T().cheer[Math.floor(Math.random()*T().cheer.length)]+"  +"+amt+" 🐾");
  render();setTimeout(function(){c.justDone=false;save();},60000);
}
/* ---- reminder: only in the app (local notifications) ---- */
function LNP(){try{var C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return null;return C.Plugins&&C.Plugins.LocalNotifications||(C.registerPlugin&&C.registerPlugin("LocalNotifications"));}catch(e){return null;}}
function remOn(){try{return localStorage.getItem("spravy-rem")==="1";}catch(e){return false;}}
function remPaint(){var L=LNP();$("remBox").hidden=!L;if(!L)return;$("remT").textContent=T().rem;var b=$("remBtn");b.textContent=remOn()?T().remOn:T().remOff;b.className=remOn()?"on":"";}
$("remBtn").onclick=function(){var L=LNP();if(!L)return;var ids=[];for(var i=0;i<7;i++)ids.push({id:7710+i});
  if(remOn()){L.cancel({notifications:ids}).catch(function(){});try{localStorage.setItem("spravy-rem","0");}catch(e){}remPaint();return;}
  L.requestPermissions().then(function(r){if(r.display!=="granted")return;var n=new Date(),list=[];for(var i=0;i<7;i++){var at=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i,18,0,0);if(at>n)list.push({id:7710+i,title:"Справи · Вайбкет",body:T().remN,schedule:{at:at}});}
    return L.cancel({notifications:ids}).catch(function(){}).then(function(){return L.schedule({notifications:list});}).then(function(){try{localStorage.setItem("spravy-rem","1");}catch(e){}remPaint();});}).catch(function(){});};
render();
})();
</script>
